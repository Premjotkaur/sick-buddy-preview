.screen.is-home .alert-banner { border-radius: 18px; margin-bottom: 4px; }

/* =====================================================================
   REDESIGN · STEP 1b — HOME FROM PREMJOT'S STICKY-NOTE SKETCH
   top row (menu + logo/name | senior toggle) → search + mic → mood line
   → calm banner → SERVICES → bottom nav (Home | Profile | Cart)
   ===================================================================== */
.tb-brand, .senior-tg { display: none; }
.topbar-home { gap: 10px; padding-top: calc(env(safe-area-inset-top) + 12px); padding-bottom: 8px; }
.topbar-home .topbar-title { display: none; }
#profileBtn { display: none; } /* PROFILE now lives in the bottom nav */
.topbar:not(.topbar-home)::after { content: ""; width: 42px; flex: none; } /* keep title centred */
.topbar-home .tb-brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding-left: 2px; border-left: 1.5px solid rgba(79,111,154,.22); margin-left: 2px; padding-left: 10px; }
.topbar-home .senior-tg { display: flex; }
.tb-logo { width: 34px; height: 34px; border-radius: 11px; background: #fff; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(79,111,154,.16); flex: none; }
.tb-logo .logo-svg { width: 28px !important; }
.tb-name { font-weight: 900; font-size: 1.12rem; letter-spacing: .01em; white-space: nowrap; color: var(--ink); }
.senior-tg { align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 14px; background: rgba(255,255,255,.75); box-shadow: 0 1px 2px rgba(44,50,58,.06); flex: none; }
.senior-txt { font-size: .62rem; font-weight: 800; line-height: 1.15; color: var(--muted); text-align: right; text-transform: uppercase; letter-spacing: .04em; }
.switch.sm { width: 40px; height: 24px; display: inline-block; flex: none; }
.switch.sm span { top: 3px; left: 3px; width: 18px; height: 18px; }
.switch.sm.on span { transform: translateX(16px); }
.senior-tg[aria-checked="true"] .switch, .switch.teal.on { background: var(--primary); }
.senior-tg[aria-checked="true"] .senior-txt { color: var(--primary-dark); }

.hb { display: flex; flex-direction: column; gap: 16px; }
/* search */
.hb-search { position: relative; z-index: 4; }
.hb-sbox { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 16px; background: #fff; border-radius: 999px; border: 1.5px solid #dde8f7; box-shadow: 0 4px 14px rgba(79,111,154,.08); transition: border-color .15s, box-shadow .15s; }
.hb-sbox:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,111,154,.14); }
.hb-sbox > svg { color: var(--primary-dark); width: 20px; height: 20px; }
.hb-sbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: .98rem; font-weight: 600; color: var(--ink); }
.hb-sbox input::placeholder { color: #9a9fa5; font-weight: 600; }
.hb-sbox input::-webkit-search-cancel-button { display: none; }
.hb-clear { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.hb-clear svg { width: 16px; height: 16px; }
.hb-mic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-dark); flex: none; position: relative; border-left: 0; }
.hb-mic svg { width: 20px; height: 20px; }
.hb-sbox .hb-cam { margin-left: -2px; }
/* scanner overlay (demo) */
.scan-ov { position: fixed; inset: 0; z-index: 90; background: rgba(15,20,26,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; color: #fff; animation: scanIn .18s ease-out; }
@keyframes scanIn { from { opacity: 0; } to { opacity: 1; } }
.scan-ov h2 { margin: 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
.scan-ov p { margin: 0; font-size: .86rem; color: #c9d1dc; text-align: center; max-width: 300px; line-height: 1.45; }
.scan-win { position: relative; width: min(78vw, 300px); aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #1d232b; box-shadow: 0 0 0 9999px rgba(0,0,0,.0); }
.scan-win video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-mock { position: absolute; inset: 0; display: grid; place-items: center; color: #7f96b5; }
.scan-mock svg { width: 46%; height: 46%; opacity: .55; }
.scan-corner { position: absolute; width: 34px; height: 34px; border: 4px solid var(--primary, #3b7dd8); }
.scan-corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.scan-corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.scan-corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.scan-corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.scan-line { position: absolute; left: 12%; right: 12%; height: 2px; background: #8ab8f5; box-shadow: 0 0 12px #8ab8f5; top: 20%; animation: scanLine 1.8s ease-in-out infinite alternate; }
@keyframes scanLine { to { top: 80%; } }
.scan-status { font-size: .74rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #9fb6d3; }
.scan-acts { display: flex; gap: 10px; width: min(78vw, 300px); }
.scan-acts .btn { flex: 1; }
.scan-ov .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.25); }
.hb-results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #fff; border-radius: 18px; border: 1px solid #dee4ec; box-shadow: 0 16px 36px rgba(44,50,58,.14); padding: 6px; max-height: 330px; overflow-y: auto; }
.hb-res { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px; }
.hb-res:hover, .hb-res:focus-visible { background: var(--primary-tint); outline: none; }
.hb-res-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-tint); color: var(--primary-dark); display: grid; place-items: center; font-size: 1.05rem; flex: none; }
.hb-res-ic svg { width: 18px; height: 18px; }
.hb-res.sos .hb-res-ic { background: var(--sos-soft); color: var(--sos); }
.hb-res-t { flex: 1; min-width: 0; line-height: 1.2; }
.hb-res-t strong { display: block; font-size: .9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-res-t span { font-size: .74rem; color: var(--muted); font-weight: 600; }
.hb-nores { padding: 12px; font-size: .84rem; color: var(--muted); text-align: center; }

/* mood line */
.hb-mood { display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 20px; padding: 12px 14px; border: 1px solid #eef1f6; box-shadow: 0 1px 2px rgba(44,50,58,.04), 0 6px 18px rgba(60,64,70,.05); }
.hb-mood-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hb-mood-q { margin: 0; font-weight: 900; font-size: 1rem; }
.hb-mood-last { font-size: .74rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.hb-mood-last a { color: var(--primary-dark); font-weight: 800; margin-left: 4px; }
.hb-faces { display: flex; justify-content: space-between; gap: 4px; }
.hb-face { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .64rem; font-weight: 800; color: var(--muted); padding: 2px 0; transition: transform .1s; }
.hb-face:active { transform: scale(.92); }
.hb-face > span:first-child { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; line-height: 1; background: var(--primary-tint); border: 2px solid transparent; transition: background .15s, border-color .15s; }
.hb-face:hover > span:first-child { background: var(--primary-soft); }
.hb-face.on > span:first-child { background: var(--primary-soft); border-color: var(--primary); }
.hb-face.on { color: var(--primary-dark); }

/* calm banner (the big rectangle in the sketch) */
.hb-banner { position: relative; overflow: hidden; display: flex; align-items: stretch; min-height: 138px; border-radius: 22px; padding: 16px 16px 14px;
  background: radial-gradient(110% 90% at 100% 0%, #cfd9e7 0, rgba(207,217,231,0) 60%), linear-gradient(135deg, #e4eaf1 0%, #eef1f5 55%, #e6ecf6 100%);
  border: 1px solid #dce2eb; }
.hb-banner-txt { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-right: 96px; }
.hb-greet { margin: 0; font-size: 1.32rem; font-weight: 900; line-height: 1.15; color: var(--ink); }
.hb-greet span { color: var(--primary-dark); }
.hb-sub { margin: 0; font-size: .86rem; font-weight: 600; color: #5f656d; }
.hb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 10px; }
.hb-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid rgba(79,111,154,.18); font-size: .74rem; font-weight: 800; color: var(--primary-dark); white-space: nowrap; }
.hb-chip svg { width: 14px; height: 14px; }
.hb-chip .hm-count { font-weight: 900; }
.hb-art { position: absolute; right: 6px; bottom: 0; width: 120px; height: 120px; pointer-events: none; }

/* SERVICES */
.hb-h { margin: 2px 2px 12px; font-size: .9rem; font-weight: 900; letter-spacing: .14em; color: var(--ink); text-decoration: underline; text-decoration-color: var(--primary); text-decoration-thickness: 2.5px; text-underline-offset: 6px; }
.hb-sos { display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px; margin-bottom: 12px; border-radius: 18px;
  background: linear-gradient(135deg, #e0685c, var(--sos) 55%, var(--sos-dark)); color: #fff; box-shadow: 0 8px 20px rgba(212,87,75,.24); transition: transform .12s; }
.hb-sos:active { transform: scale(.98); }
.hb-sos .hm-sos-icon { width: 38px; height: 38px; }
.hb-sos .hm-sos-icon svg { width: 20px; height: 20px; }
.hb-sos-t { flex: 1; min-width: 0; line-height: 1.2; }
.hb-sos-t strong { display: block; font-size: .98rem; font-weight: 900; }
.hb-sos-t span { font-size: .74rem; opacity: .92; font-weight: 600; }
.hb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.hb-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 2px 10px; border-radius: 18px; background: #fff; border: 1px solid #eef1f6; box-shadow: 0 1px 2px rgba(44,50,58,.04), 0 4px 12px rgba(60,64,70,.05); text-align: center; transition: transform .12s; }
.hb-tile:active { transform: scale(.95); }
.hb-tile .hm-tile-icon { width: 46px; height: 46px; border-radius: 15px; }
.hb-tile-l { font-size: .74rem; font-weight: 800; line-height: 1.15; color: var(--ink); }
.hb-tile.tone-peach .hm-tile-icon { background: #e9eef6; color: #c27a4a; }
.hb-tile.tone-blue  .hm-tile-icon { background: #e7eef7; color: #4f74a6; }
.hb-tile.tone-sage  .hm-tile-icon { background: #e8f0fb; color: #3b7dd8; }
.hb-tile.tone-lilac .hm-tile-icon { background: #eeecf5; color: #6e66a3; }
.hb-tile.tone-sky   .hm-tile-icon { background: #e6eefb; color: #3a6fc0; }
.hb-tile.tone-sand  .hm-tile-icon { background: #f2f5fa; color: #9b7f35; }
.hb-tile.tone-teal  .hm-tile-icon { background: var(--primary-soft); color: var(--primary-dark); }
.hb-tile.tone-amber .hm-tile-icon { background: #f4f7fb; color: #b08327; }

/* bottom dock: cart bar floats above the persistent nav */
.dock { position: relative; z-index: 7; flex: none; }
.dock .cartbar { bottom: 100%; padding-bottom: 10px; }
.bnav { display: flex; align-items: stretch; justify-content: space-around; gap: 4px; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: #fff; border-top: 1.5px solid #d7dde6; box-shadow: 0 -6px 18px rgba(44,50,58,.05); }
.bnav-i { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border-radius: 14px; color: #7f848b; font-size: .66rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.bnav-i svg { width: 24px; height: 24px; }
.bnav-i .bnav-ic { position: relative; width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
.bnav-i.on { color: var(--primary-dark); }
.bnav-i.on .bnav-ic { background: var(--primary-soft); }
.bnav-badge { position: absolute; top: -3px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary-dark); color: #fff; font-size: .62rem; font-weight: 900; letter-spacing: 0; display: grid; place-items: center; border: 2px solid #fff; }
.toast { bottom: 96px; }

/* profile additions */
.pf-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pf-link { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-radius: 14px; background: var(--primary-tint); font-weight: 800; font-size: .86rem; color: var(--primary-dark); }


/* =====================================================================
   ADD-ON — SENIOR SERVICES (step 2c): 9 tiles only + Voice assistance,
   plus Add medicine & Med reminder (both modes)
   ===================================================================== */
.hb-tile.tone-red .hm-tile-icon { background: var(--sos); color: #fff; }
.hb-tile.tone-voice .hm-tile-icon { background: var(--primary); color: #fff; }
.hb-tile.tone-rose .hm-tile-icon, .tone-rose .tile-icon { background: #eaf2fd; color: #2a62b5; }
.hb-tile { position: relative; }
.hb-tile-dot { position: absolute; top: 8px; right: 10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #e0a43a; color: #fff; font-size: .62rem; font-weight: 900; display: grid; place-items: center; }
.hb-grid.senior-grid, html.senior .hb-grid.senior-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
.senior-grid .hb-tile { flex-direction: row; justify-content: flex-start; text-align: left; gap: 12px; padding: 14px 12px; min-height: 84px; }
.senior-grid .hb-tile-l, html.senior .senior-grid .hb-tile-l { font-size: .95rem; font-weight: 900; }
.senior-grid .hb-tile .hm-tile-icon { flex: none; }
.senior-grid .hb-tile.sg-voice { grid-column: 1 / -1; background: linear-gradient(160deg, #e6ecf3 0%, #f6f8fb 100%); border-color: #d9e6f8; }
.senior-grid .hb-tile-l small { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-top: 2px; }
.senior-grid .hb-tile.sg-sos { border-color: #f3d3cf; }
.senior-grid .hb-tile.sg-sos .hb-tile-l { color: #b5443a; }
/* voice assistant overlay (demo) */
.va-ring { position: relative; width: 132px; height: 132px; border-radius: 50%; background: var(--primary, #3b7dd8); color: #fff; display: grid; place-items: center; flex: none; }
.va-ring svg { width: 54px; height: 54px; }
.va-ring.on::before, .va-ring.on::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid #8ab8f5; animation: hmPing 1.4s ease-out infinite; }
.va-ring.on::after { animation-delay: .7s; }
.va-heard { min-height: 1.6em; font-size: 1.05rem; font-weight: 800; color: #fff; text-align: center; }
html.senior .va-heard { font-size: 1.25rem; }
/* next-dose strip on home */
.md-strip { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 10px 10px 10px 12px; border-radius: 18px; background: #fff; border: 1px solid #d2ddee; box-shadow: 0 1px 2px rgba(44,50,58,.04), 0 4px 12px rgba(60,64,70,.05); }
.md-strip.due { background: #e9eff7; border-color: #efd7a6; }
.md-strip-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: #eaf2fd; color: #2a62b5; flex: none; }
.md-strip-ic svg { width: 23px; height: 23px; }
.md-strip-t { flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
.md-strip-t strong { font-size: .86rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.md-strip-t span { font-size: .72rem; color: var(--muted); font-weight: 700; }
.md-strip .btn { padding: 8px 12px; font-size: .78rem; min-height: 0; flex: none; }
html.senior .md-strip .btn { padding: 11px 14px; font-size: .86rem; }
/* reminder screen */
.md-hero { padding: 18px 16px 16px; border-radius: 26px; background: linear-gradient(170deg, #ecf1f8 0%, #f6f8fb 100%); position: relative; overflow: hidden; }
.md-hero.due { background: linear-gradient(170deg, #e1e9f4 0%, #f6f8fb 100%); }
.md-hero-k { font-size: .7rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #2a62b5; }
.md-hero.due .md-hero-k { color: #9a6c12; }
.md-hero-time { font-size: 2.1rem; font-weight: 900; line-height: 1.1; margin: 4px 0 2px; }
.md-hero-name { font-size: 1.02rem; font-weight: 900; }
.md-hero-dose { font-size: .84rem; color: var(--muted); font-weight: 700; }
.md-hero-acts { display: flex; gap: 10px; margin-top: 14px; }
.md-hero-acts .btn { flex: 1; }
.md-hero-ic { position: absolute; right: 16px; top: 16px; width: 54px; height: 54px; border-radius: 18px; background: #fff; color: #2a62b5; display: grid; place-items: center; box-shadow: var(--shadow); }
.md-hero-ic svg { width: 30px; height: 30px; }
.md-dose { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px; border-radius: 16px; box-shadow: var(--shadow); margin-top: 8px; }
.md-dose-time { width: 66px; flex: none; font-weight: 900; font-size: .9rem; }
.md-st { font-size: .7rem; font-weight: 900; padding: 4px 9px; border-radius: 999px; flex: none; }
.md-st.taken { background: #e8f0fb; color: #3f597a; }
.md-st.due { background: #f4f7fb; color: #9a6c12; }
.md-st.later { background: #eeeff1; color: #6a7077; }
.md-st.snoozed { background: #eeecf5; color: #5f589a; }
.md-st.missed { background: #eaf2fd; color: #a24e58; }
.md-times { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
.md-custom.field { flex-direction: row; gap: 8px; align-items: center; margin-top: 10px; }
.md-custom .btn { flex: none; }
.md-dose .grow { flex: 1; min-width: 0; }
.md-st { white-space: nowrap; }
.md-custom input { flex: 1; }
.md-med { display: flex; align-items: center; gap: 12px; }
.md-med .grow { min-width: 0; }
.md-del { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #a24e58; background: #eaf2fd; flex: none; }
.md-del svg { width: 18px; height: 18px; }
html.senior .md-hero-time { font-size: 2.5rem; }
/* personal look (normal mode only) */
.pf-face { font-size: 2.6rem; background: var(--primary-soft); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--primary); }
.pf-accent-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); font-size: .72rem; font-weight: 900; }
.pf-accent-tag span { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.pf-sub { font-size: .74rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 6px; }
.pf-faces { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.pf-fc { aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 12px; font-size: 1.3rem; display: grid; place-items: center; background: #eef1f6; border: 2px solid transparent; }
.pf-fc.on { background: var(--primary-soft); border-color: var(--primary); }
.pf-sw { display: flex; flex-wrap: wrap; gap: 10px; }
.pf-swatch { width: 38px; height: 38px; border-radius: 50%; background: var(--sw); border: 3px solid #fff; box-shadow: 0 0 0 1.5px #d5dbe3; }
.pf-swatch.on { box-shadow: 0 0 0 3px var(--sw); }
.pf-look-off { text-align: center; margin: 0; }
html.senior .md-dose-time { width: 80px; font-size: 1rem; }

/* ---------- Senior citizen mode (demo): larger type, bigger targets ---------- */
html.senior { font-size: 19px; }
html.senior .hb-sbox { height: 60px; }
html.senior .hb-mic { width: 48px; height: 48px; }
html.senior .scan-ov h2 { font-size: 1.35rem; } html.senior .scan-ov p { font-size: 1rem; }
html.senior .hb-face > span:first-child { width: 50px; height: 50px; font-size: 1.5rem; }
html.senior .hb-face { font-size: .72rem; }
html.senior .hb-grid { grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
html.senior .hb-tile .hm-tile-icon { width: 56px; height: 56px; }
html.senior .hb-tile .hm-tile-icon svg { width: 30px; height: 30px; }
html.senior .hb-tile-l { font-size: .82rem; }
html.senior .bnav-i { font-size: .72rem; }
html.senior .bnav-i svg { width: 28px; height: 28px; }
html.senior .bnav-i .bnav-ic { height: 36px; width: 60px; }
html.senior .icon-btn { width: 48px; height: 48px; }
html.senior .tb-name { font-size: 17px; }
html.senior .tb-logo { width: 32px; height: 32px; }
html.senior .senior-txt { font-size: 9.5px; }
html.senior .topbar-home { gap: 8px; }
html.senior .hb-mood-head { flex-wrap: wrap; row-gap: 2px; }
/* step 2d: no mood check-in on home in Senior citizen mode */
html.senior .hb .hb-mood { display: none !important; }
html.senior .hb-art { opacity: .55; }
html.senior .hb-banner-txt { padding-right: 70px; }
html.senior .hb-res-t strong { font-size: .95rem; }


/* =====================================================================
   REDESIGN · STEP 1c — SALINA TYPEFACE LOOK
   Display face: "DM Serif Display" (Google Fonts, SIL OFL) — closest free
   match to Salina: high-contrast modern serif, heavy verticals / hairline
   horizontals, ball + teardrop terminals (a, S, y), flat sharp serifs.
   Serif = brand/display only (wordmark, hero greeting, SERVICES, screen
   titles). Everything else (nav, buttons, search, body, tiles) = Nunito.
   DM Serif Display ships one weight (400) — never faux-bold it.
   ===================================================================== */
:root { --font-display: "DM Serif Display", "Libre Bodoni", "Playfair Display", Didot, "Bodoni 72", Georgia, serif; }
.tb-name, .drawer-name, .brand, .hm-brand, .hm-greet, .hb-greet, .hb-h,
.topbar-title, .screen h1, .section-title {
  font-family: var(--font-display); font-weight: 400; font-synthesis: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
/* wordmark */
.tb-name { font-size: 1.42rem; letter-spacing: -.005em; line-height: 1; transform: translateY(1px); }
.drawer-name { font-size: 1.35rem; letter-spacing: 0; }
.brand { font-size: 2.6rem; letter-spacing: -.01em; line-height: 1.05; }
.hm-brand { font-size: 1.25rem; letter-spacing: 0; }
.hm-brand small { font-family: var(--font); }
/* hero greeting */
.hb-greet { font-size: 1.72rem; line-height: 1.08; letter-spacing: -.012em; }
.hb-greet span { font-style: italic; color: var(--primary-dark); }
.hm-greet { font-size: 2.1rem; letter-spacing: -.012em; }
/* SERVICES heading — spaced small-caps feel in the serif */
.hb-h { font-size: 1.12rem; letter-spacing: .16em; text-underline-offset: 7px; text-decoration-thickness: 2px; }
/* screen titles */
.topbar-title { font-size: 1.3rem; letter-spacing: 0; line-height: 1.1; }
.screen h1 { font-size: 1.8rem; letter-spacing: -.01em; line-height: 1.12; }
.section-title { font-size: 1.3rem; letter-spacing: 0; }
.screen h1 svg, .section-title svg { font-family: var(--font); }
html.senior .hb-greet { font-size: 1.62rem; }

/* =====================================================================
   REDESIGN · STEP 2 — SOS / EMERGENCY / MISSED CHECK-IN
   Same language as the new home: warm off-white canvas, teal/sage UI,
   DM Serif Display titles, Nunito for everything else.
   RED IS RESERVED FOR SOS: the SOS button, the live-SOS ring/pill and
   the emergency-call action. Missed check-in = warm amber, "I'm safe /
   I'm okay" = calm green-teal. Red topbars are gone.
   ===================================================================== */
:root { --amber-ink: #8a6418; --amber-line: #ecd9a8; --sage: #9dbbe6; }
/* topbars: off-white, serif title, small status dot instead of a red slab */
.topbar-sos, .topbar-alert { background: var(--bg); color: var(--ink); }
.topbar-sos .topbar-title::before, .topbar-alert .topbar-title::before {
  content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 3px;
}
.topbar-sos .topbar-title::before { background: var(--sos); box-shadow: 0 0 0 4px var(--sos-soft); }
.topbar-alert .topbar-title::before { background: #d9a23a; box-shadow: 0 0 0 4px var(--amber-bg); }

.sx-title { font-family: var(--font-display); font-weight: 400; font-synthesis: none; font-size: 2rem; line-height: 1.08; letter-spacing: -.012em; margin: 0; color: var(--ink); }
.sx-title em { font-style: italic; color: var(--primary-dark); }
.sx-sub { margin: 6px auto 0; color: var(--muted); font-weight: 600; font-size: .93rem; line-height: 1.4; max-width: 30ch; }
.sx-eyebrow { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 8px; font-size: .7rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--primary-dark); background: #fff; border-radius: 999px; padding: 6px 11px; box-shadow: 0 1px 2px rgba(44,50,58,.06); }
.sx-eyebrow svg { width: 14px; height: 14px; }
.sx-eyebrow.amber { color: var(--amber-ink); background: #eef2f9; }
.sx-h { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; letter-spacing: 0; margin: 0 0 4px; }
.sx-card { border: 1px solid #e6ebf2; }
.sx-card .card-head { margin-bottom: 2px; }

/* --- SOS idle hero --- */
.sx-hero { text-align: center; padding: 18px 16px 8px; border-radius: 26px; background: linear-gradient(170deg, #eef4fd 0%, #f6f8fb 100%); position: relative; overflow: hidden; }
.sx-hero::before { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.55); right: -70px; top: -90px; }
.sx-hero > * { position: relative; }
.sx-hero .sos-wrap { padding: 30px 0 22px; }
.sx-hero .sos-btn {
  width: 188px; height: 188px; gap: 2px;
  background: radial-gradient(circle at 34% 28%, #ea7d71, var(--sos) 62%, var(--sos-dark));
  box-shadow: 0 0 0 12px rgba(212,87,75,.12), 0 0 0 26px rgba(212,87,75,.06), 0 18px 36px rgba(184,68,58,.32);
  animation: sxPulse 2.4s ease-in-out infinite;
}
@keyframes sxPulse { 50% { box-shadow: 0 0 0 16px rgba(212,87,75,.14), 0 0 0 34px rgba(212,87,75,.05), 0 18px 36px rgba(184,68,58,.32); } }
.sx-hero .sos-text { font-family: var(--font-display); font-weight: 400; font-size: 3.6rem; letter-spacing: .04em; }
.sx-hero .sos-sub { font-size: .78rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
.sx-hint { margin: 0; font-size: .78rem; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sx-hint svg { width: 15px; height: 15px; color: var(--primary); }

/* quick-call tiles (white; only the phone glyph carries the SOS red) */
.sx-calls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sx-call { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); border: 1px solid #e6ebf2; color: var(--ink); transition: transform .12s; min-width: 0; }
.sx-call:active { transform: scale(.98); }
.sx-call-ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--sos-soft); color: var(--sos-dark); }
.sx-call-ic svg { width: 20px; height: 20px; }
.sx-call.calm .sx-call-ic { background: var(--primary-soft); color: var(--primary-dark); }
.sx-call-t { min-width: 0; line-height: 1.2; }
.sx-call-t strong { display: block; font-weight: 900; font-size: .98rem; }
.sx-call-t small { display: block; color: var(--muted); font-weight: 600; font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-call.wide { grid-column: 1 / -1; }

/* numbered "what SOS does" */
.sx-steps { list-style: none; margin: 8px 0 10px; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: sx; }
.sx-steps li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.35; font-size: .92rem; counter-increment: sx; }
.sx-steps li::before { content: counter(sx); width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-dark); font-weight: 900; font-size: .8rem; margin-top: -2px; }
.sx-steps .badge-demo { margin-left: 2px; }

/* who-gets-alerted avatars */
.sx-people { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 8px; }
.sx-person { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sx-person .avatar { width: 36px; height: 36px; font-size: .9rem; }
.sx-person .small { line-height: 1.2; }
.sx-empty { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--amber-bg); color: var(--amber-ink); font-size: .85rem; font-weight: 700; }
.sx-empty svg { width: 18px; height: 18px; flex: none; }

.sx-soft { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--primary-tint); border: 1px solid #dde8f7; color: var(--ink); }
.sx-soft .sx-call-ic { background: #fff; color: var(--primary-dark); }
.sx-soft .grow strong { display: block; font-weight: 900; font-size: .92rem; }
.sx-soft .grow span { font-size: .78rem; color: var(--muted); font-weight: 600; }
.sx-soft .chev { color: var(--primary-dark); font-weight: 900; font-size: 1.3rem; }

/* --- confirm sheet --- */
.sx-sheet { text-align: center; }
.sx-sheet-grab { width: 42px; height: 5px; border-radius: 999px; background: #d5dbe3; margin: -8px auto 14px; }
.sx-sheet-badge { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .04em;
  background: radial-gradient(circle at 34% 28%, #ea7d71, var(--sos) 62%, var(--sos-dark)); box-shadow: 0 0 0 8px var(--sos-soft); }
.sx-sheet h3 { justify-content: center; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 1.75rem; margin: 6px 0 4px; letter-spacing: -.01em; }
.sx-sheet > p { margin: 0 auto; max-width: 30ch; font-size: .92rem; }
.sx-sheet-list { list-style: none; padding: 0; margin: 16px 0 4px; text-align: left; background: var(--bg); border-radius: 16px; border: 1px solid #e6ebf2; }
.sx-sheet-list li { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: .9rem; font-weight: 700; }
.sx-sheet-list li + li { border-top: 1px solid #dee4ee; }
.sx-sheet-list svg { width: 18px; height: 18px; color: var(--primary-dark); flex: none; }
.sx-sheet .modal-actions .btn { padding-top: 14px; padding-bottom: 14px; }

/* --- SOS active --- */
.sx-live { text-align: center; padding: 16px 16px 20px; border-radius: 26px; background: linear-gradient(175deg, #fff 0%, #fbf3ef 100%); border: 1px solid #f3e1dc; box-shadow: var(--shadow); }
.sx-live-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
.sx-live-pill { display: inline-flex; align-items: center; gap: 7px; font-size: .7rem; font-weight: 900; letter-spacing: .14em; color: #fff; background: var(--sos); border-radius: 999px; padding: 6px 11px; }
.sx-live-pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: sxBlink 1.2s infinite; }
@keyframes sxBlink { 50% { opacity: .25; } }
.sx-elapsed { font-size: .78rem; font-weight: 700; color: var(--muted); }
.sx-elapsed b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 900; }
.sx-live .pulse-ring.sos { width: 116px; height: 116px; font-family: var(--font-display); font-weight: 400; font-size: 2rem; letter-spacing: .04em;
  background: radial-gradient(circle at 34% 28%, #ea7d71, var(--sos) 62%, var(--sos-dark)); margin-bottom: 18px; }
.sx-progress { display: flex; gap: 6px; justify-content: center; margin: 14px 0 0; }
.sx-progress span { font-size: .72rem; font-weight: 800; color: var(--primary-dark); background: var(--primary-tint); border: 1px solid #dde8f7; border-radius: 999px; padding: 4px 9px; display: inline-flex; gap: 5px; align-items: center; }
.sx-progress svg { width: 12px; height: 12px; }
.sx-call-big { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 17px; border-radius: 18px; color: #fff; font-weight: 900; font-size: 1.1rem;
  background: linear-gradient(135deg, #e0685c, var(--sos) 55%, var(--sos-dark)); box-shadow: 0 10px 22px rgba(184,68,58,.28); }
.sx-call-big svg { width: 22px; height: 22px; }
.sx-call-sub { margin: -6px 0 0; text-align: center; font-size: .8rem; color: var(--muted); font-weight: 600; }
.sx-call-sub a { color: var(--primary-dark); font-weight: 800; }
.sx-wait li { font-size: .9rem; }
.sx-safe { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 1.05rem; color: #fff;
  background: linear-gradient(135deg, #5a7ba7, var(--primary) 50%, var(--primary-dark)); box-shadow: 0 10px 22px rgba(61,90,127,.26); }
.sx-safe svg { width: 22px; height: 22px; stroke-width: 2.6; }
.sx-safe-note { margin: -6px 0 0; text-align: center; font-size: .76rem; color: var(--muted); font-weight: 600; }
.status-pill { font-family: var(--font); }
.status-pill.sim:not(.ok) { background: #e7ecf3; color: var(--muted); }

/* --- missed check-in (amber, not red) --- */
.sx-miss { text-align: center; padding: 20px 16px 18px; border-radius: 26px; background: linear-gradient(170deg, #eef2f9 0%, #e9eef6 100%); border: 1px solid var(--amber-line); }
.sx-miss-ring { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 34% 28%, #e8bd63, #c9902c); animation: sxAmber 1.8s infinite; }
.sx-miss-ring svg { width: 40px; height: 40px; animation: sxWiggle 1.8s ease-in-out infinite; transform-origin: 50% 15%; }
@keyframes sxAmber { 0% { box-shadow: 0 0 0 0 rgba(201,144,44,.4); } 100% { box-shadow: 0 0 0 22px rgba(201,144,44,0); } }
@keyframes sxWiggle { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(12deg); } 20%, 40% { transform: rotate(-12deg); } }
.sx-miss .sx-title em { color: var(--amber-ink); }
.sx-grace { margin: 16px 0 0; background: #fff; border-radius: 18px; padding: 12px 14px; text-align: left; box-shadow: 0 1px 3px rgba(22,36,58,.06); }
.sx-grace-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sx-grace-row span { font-size: .8rem; font-weight: 800; color: var(--muted); }
.sx-grace-row b { font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--amber-ink); letter-spacing: .02em; }
.sx-grace-bar { height: 8px; border-radius: 999px; background: #d9e2f0; margin-top: 8px; overflow: hidden; }
.sx-grace-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #e3b553, #c9902c); transition: width 1s linear; }
.sx-miss + .ok-btn.wide, .sx-okay { border-radius: 18px; }
.btn-outline-amber { background: #fff; color: var(--amber-ink); border: 1.5px solid var(--amber-line); }
.msg-preview { font-style: normal; background: var(--bg); border: 1px dashed #e1dacd; }
.msg-preview q { font-style: italic; display: block; }

/* home: missed check-in banner becomes amber (red stays exclusive to SOS strip) */
.alert-banner.sx-banner { background: #eaeff7; color: var(--ink); border: 1.5px solid var(--amber-line); animation: none; padding: 11px 12px; gap: 12px; box-shadow: 0 6px 16px rgba(169,122,28,.10); }
.sx-banner-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #e9b24e; color: #fff; flex: none; position: relative; }
.sx-banner-ic::after { content: ""; position: absolute; inset: -3px; border-radius: 14px; border: 2px solid rgba(233,178,78,.5); animation: hmPing 2.2s ease-out infinite; }
.sx-banner-ic svg { width: 20px; height: 20px; }
.sx-banner-t { flex: 1; min-width: 0; line-height: 1.25; }
.sx-banner-t strong { display: block; font-weight: 900; font-size: .95rem; }
.sx-banner-t span { font-size: .78rem; color: var(--muted); font-weight: 700; }
.sx-banner-t b { color: var(--amber-ink); font-variant-numeric: tabular-nums; }
.sx-banner-go { font-size: .74rem; font-weight: 900; letter-spacing: .06em; color: #fff; background: var(--primary-dark); border-radius: 999px; padding: 7px 11px; flex: none; }

/* check-ins screen: countdown in serif-friendly calm style, missed = amber */
.countdown.missed .countdown-num { color: var(--amber-ink); }

html.senior .sx-title { font-size: 1.85rem; }
/* 9 service tiles now (Cleaning added) → 3×3 grid, no orphan tile */
.hb-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hb-grid .hb-tile { padding: 12px 4px 11px; }

/* =====================================================================
   ADD-ON — CLEANING ASSISTANCE (pre-book only). Teal family, no red.
   ===================================================================== */
.hb-tile.tone-mint .hm-tile-icon, .tone-mint .tile-icon { background: #dfe6f0; color: #3a5a85; }
.cl-hero { padding: 18px 16px 16px; border-radius: 26px; background: linear-gradient(170deg, #eef4fd 0%, #f6f8fb 100%); position: relative; overflow: hidden; }
.cl-hero::before { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.55); right: -60px; top: -70px; }
.cl-hero > * { position: relative; }
.cl-hero .sx-title { font-size: 1.8rem; padding-right: 64px; }
.cl-hero .sx-sub { margin: 6px 0 0; max-width: 32ch; }
.cl-hero-ic { position: absolute; right: 16px; top: 16px; width: 54px; height: 54px; border-radius: 18px; background: #fff; color: #3a5a85; display: grid; place-items: center; box-shadow: var(--shadow); }
.cl-hero-ic svg { width: 30px; height: 30px; }
.cl-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.cl-pills span { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 800; color: var(--primary-dark); background: #fff; border-radius: 999px; padding: 5px 10px; }
.cl-pills svg { width: 13px; height: 13px; }
.cl-step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); font-size: .78rem; font-weight: 900; font-family: var(--font); }
.cl-card h2.sx-h { display: flex; align-items: center; gap: 10px; }
.cl-days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; margin: 6px -2px 0; scrollbar-width: none; }
.cl-days::-webkit-scrollbar { display: none; }
.cl-days .day { min-width: 70px; flex: none; }
.cl-slots { grid-template-columns: repeat(3, 1fr); }
.cl-addr { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 1px solid #e6ebf2; font-size: .86rem; font-weight: 700; margin: 6px 0 10px; }
.cl-addr svg { width: 18px; height: 18px; color: var(--primary-dark); flex: none; margin-top: 1px; }
.cl-addr a { margin-left: auto; flex: none; }
.cl-payout { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--green-bg); color: #2f4a6e; font-size: .82rem; font-weight: 600; line-height: 1.35; }
.cl-payout svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.cl-payout strong { font-weight: 900; }
.cl-sheet .sx-sheet-list li.cl-total { background: #fff; }
.cl-sheet .sx-sheet-list li.cl-total b { font-size: 1rem; }
.cl-sheet .sx-sheet-list li.cl-earn { background: var(--green-bg); border-radius: 0 0 15px 15px; }
.cl-sheet .sx-sheet-list li.cl-earn b, .cl-sheet .sx-sheet-list li.cl-earn span.grow, .cl-sheet .sx-sheet-list li.cl-earn svg { color: #2f4a6e; }
.cl-summary .sum-row span:first-child { color: var(--muted); font-weight: 700; }
.cl-sheet .sx-sheet-badge { background: radial-gradient(circle at 34% 28%, #7c99c0, var(--primary) 62%, var(--primary-dark)); box-shadow: 0 0 0 8px var(--primary-soft); }
.cl-sheet .sx-sheet-badge svg { width: 30px; height: 30px; }
.cl-sheet .sx-sheet-list li span.grow { flex: none; width: 92px; color: var(--muted); font-weight: 700; }
.cl-sheet .sx-sheet-list li b { flex: 1; min-width: 0; }
.cl-sheet .sx-sheet-list li b { font-weight: 900; text-align: right; }

html.senior .sx-calls { grid-template-columns: 1fr; }
html.senior .sx-hero .sos-btn { width: 200px; height: 200px; }

/* =====================================================================
   STEP 2e — DARK MODE (toggle lives in the hamburger side menu)
   html.dark — persisted in localStorage('sickbuddy.dark'). Works with
   html.senior on or off. SOS / emergency keeps its red (--sos untouched).
   ===================================================================== */
html.dark {
  color-scheme: dark;
  --primary-dark: #9cc2f5;   /* used as text/icon colour → lighter on dark */
  --primary-soft: #1f3350;
  --primary-tint: #16233a;
  --ink: #e6e9ec;
  --muted: #9aa0a8;
  --line: #2a3446;
  --bg: #0f1520;
  --card: #18202d;
  --card-2: #1e2737;
  --green: #6c90c0;
  --green-bg: #1c2632;

   STEP 2f — SIMPLER: prescription-first add medicine · easy home · senior voice bar
   ===================================================================== */
/* --- easy home: 2-column, big labelled tiles --- */
.hb-grid.easy-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
.easy-grid .hb-tile { flex-direction: row; align-items: center; justify-content: flex-start; text-align: left; gap: 12px; padding: 14px 12px; min-height: 78px; border-radius: 20px; }
.easy-grid .hb-tile .hm-tile-icon { width: 48px; height: 48px; flex: none; }
.easy-grid .hb-tile .hm-tile-icon svg { width: 27px; height: 27px; }
.easy-grid .hb-tile-l { font-size: .98rem; font-weight: 900; line-height: 1.15; }
.easy-grid .hb-tile-l small { display: block; margin-top: 3px; font-size: .74rem; font-weight: 700; color: var(--muted); line-height: 1.2; }
.easy-grid .hb-tile.ez-add { grid-column: 1 / -1; background: linear-gradient(160deg, #ecf1f8 0%, #f6f8fb 100%); border-color: #f2ddd3; }
.easy-grid .hb-tile.ez-add .ez-go { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 999px; background: #2a62b5; color: #fff; font-size: .78rem; font-weight: 900; flex: none; }
.easy-grid .hb-tile.ez-add .ez-go svg { width: 18px; height: 18px; }
.hb-more { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 13px 14px; border-radius: 18px; border: 1.5px dashed #ddd6c9; color: var(--ink); min-height: 56px; }
.hb-more > svg:first-child { width: 22px; height: 22px; color: var(--primary-dark); }
.hb-more span:not(.chev) { flex: 1; min-width: 0; font-weight: 800; font-size: .9rem; }
.hb-more small { display: block; font-size: .74rem; color: var(--muted); font-weight: 700; }
.hb-more .chev { font-size: 1.4rem; color: var(--muted); }
html.senior .easy-grid .hb-tile-l { font-size: 1.02rem; }

/* --- drawer sections --- */
.drawer-sec { margin: 12px 10px 2px; font-size: .68rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* --- profile: more services list --- */
.pf-more { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.pf-row { display: flex; align-items: center; gap: 12px; padding: 12px 6px; min-height: 58px; border-bottom: 1px solid var(--line); }
.pf-row:last-child { border-bottom: 0; }
.pf-row .hm-tile-icon { width: 40px; height: 40px; border-radius: 13px; flex: none; }
.pf-row .hm-tile-icon svg { width: 22px; height: 22px; }
.pf-row.tone-sky .hm-tile-icon { background: #e6eefb; color: #3a6fc0; } .pf-row.tone-sand .hm-tile-icon { background: #f2f5fa; color: #9b7f35; } .pf-row.tone-teal .hm-tile-icon { background: var(--primary-soft); color: var(--primary-dark); } .pf-row.tone-amber .hm-tile-icon { background: #f4f7fb; color: #b08327; } .pf-row.tone-rose .hm-tile-icon { background: #eaf2fd; color: #2a62b5; } .pf-row.tone-lilac .hm-tile-icon { background: #eeecf5; color: #6e66a3; }
html.dark .pf-row .hm-tile-icon { background: var(--card-2) !important; }
.pf-row span.grow { flex: 1; min-width: 0; }
.pf-row strong { display: block; font-size: .95rem; font-weight: 900; }
.pf-row small { display: block; font-size: .76rem; color: var(--muted); font-weight: 700; }
.pf-row .chev { font-size: 1.4rem; color: var(--muted); }

/* --- add medicine: prescription first --- */
.rx-stepper { display: flex; gap: 8px; }
.rx-stepper span { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--card); font-size: .78rem; font-weight: 800; color: var(--muted); box-shadow: var(--shadow); }
.rx-stepper b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #eeeff1; font-size: .74rem; flex: none; }
.rx-stepper span.on { color: var(--ink); }
.rx-stepper span.on b { background: #2a62b5; color: #fff; }
.rx-stepper span.done b { background: var(--green); color: #fff; }
.rx-up { display: flex; flex-direction: column; gap: 12px; }
.rx-up-art { position: relative; display: grid; place-items: center; padding: 18px 0 6px; }
.rx-up-art .rx-paper { width: 168px; transform: rotate(-4deg); box-shadow: 0 10px 24px rgba(60,64,70,.14); }
.rx-up-art .rx-cam { position: absolute; right: calc(50% - 112px); bottom: 0; width: 58px; height: 58px; border-radius: 18px; background: #2a62b5; color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(42,98,181,.35); }
.rx-up-art .rx-cam svg { width: 30px; height: 30px; }
.rx-up h1 { margin: 6px 0 0; font-size: 1.35rem; font-weight: 900; text-align: center; }
.rx-up .rx-lead { margin: 0 0 4px; text-align: center; color: var(--muted); font-weight: 700; font-size: .9rem; }
.rx-btn { position: relative; min-height: 60px; font-size: 1.05rem; border-radius: 18px; cursor: pointer; }
.rx-btn svg { width: 24px; height: 24px; }
.rx-btn input { position: absolute; inset: 0; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.rx-btn.btn-primary { background: #2a62b5; box-shadow: 0 8px 18px rgba(42,98,181,.3); }
.rx-demo { align-self: center; padding: 8px 12px; border-radius: 10px; font-size: .84rem; font-weight: 800; color: var(--primary-dark); text-decoration: underline; text-underline-offset: 3px; }
.rx-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.rx-or::before, .rx-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rx-manual { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; min-height: 60px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); text-align: left; }
.rx-manual > svg { width: 22px; height: 22px; color: var(--muted); }
.rx-manual span:not(.chev) { flex: 1; font-weight: 800; }
.rx-manual small { display: block; font-size: .76rem; color: var(--muted); font-weight: 700; }
.rx-manual .chev { font-size: 1.4rem; color: var(--muted); }
/* fake prescription paper */
.rx-paper { background: #ffffff; color: #2b3340; border-radius: 10px; padding: 10px 11px 12px; font-size: 8.5px; line-height: 1.35; border: 1px solid #d4deec; text-align: left; }
.rx-paper .rp-h { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1.5px solid #4f74a6; padding-bottom: 5px; margin-bottom: 5px; }
.rx-paper .rp-h > span:last-child { white-space: nowrap; margin-left: 6px; }
.rx-paper .rp-h b { display: block; font-size: 9.5px; color: #3c5f93; }
.rx-paper .rp-rx { font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: #3c5f93; line-height: 1; margin: 2px 0 3px; }
.rx-paper .rp-l { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; font-size: 9.5px; color: #24346b; margin: 3px 0; }
.rx-paper .rp-sig { text-align: right; font-family: "Segoe Script", "Bradley Hand", cursive; color: #24346b; margin-top: 6px; font-size: 9px; }
.rx-paper.lg { font-size: 11px; padding: 14px 16px 16px; }
.rx-paper.lg .rp-h b { font-size: 12.5px; }
.rx-paper.lg .rp-rx { font-size: 22px; }
.rx-paper.lg .rp-l { font-size: 12.5px; margin: 5px 0; }
.rx-paper.lg .rp-sig { font-size: 12px; }
/* scanning */
.rx-scan { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 6px; }
.rx-scan-win { position: relative; width: 100%; max-width: 300px; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 28px rgba(60,64,70,.16); }
.rx-scan-win img { display: block; width: 100%; max-height: 360px; object-fit: cover; }
.rx-scan-win .rx-paper { border-radius: 0; border: 0; }
.rx-scan-win::after { content: ""; position: absolute; left: 0; right: 0; height: 46px; top: -46px; background: linear-gradient(180deg, rgba(42,98,181,0), rgba(42,98,181,.28) 80%, #2a62b5); animation: rxScan 1.4s ease-in-out infinite; }
@keyframes rxScan { 0% { top: -46px; } 100% { top: 100%; } }
.rx-scan-st { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.05rem; }
.rx-spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #f0d6d9; border-top-color: #2a62b5; animation: rxSpin .8s linear infinite; }
@keyframes rxSpin { to { transform: rotate(360deg); } }
.rx-scan-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .86rem; font-weight: 700; color: var(--muted); }
.rx-scan-steps li.ok { color: var(--green); }
/* confirm */
.rx-found { display: flex; gap: 12px; align-items: center; }
.rx-thumb { width: 64px; height: 78px; flex: none; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #ffffff; position: relative; }
.rx-thumb img { width: 100%; height: 100%; object-fit: cover; }
.rx-thumb .rx-paper { transform: scale(.38); transform-origin: top left; width: 168px; border: 0; }
.rx-found .grow { flex: 1; min-width: 0; }
.rx-found h1 { margin: 0; font-size: 1.2rem; font-weight: 900; }
.rx-found p { margin: 2px 0 0; font-size: .8rem; color: var(--muted); font-weight: 700; }
.rx-found .btn { padding: 9px 12px; font-size: .8rem; flex: none; }
.rx-warn { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: #e9eff7; border: 1px solid #efd7a6; color: #7a5a14; font-size: .84rem; font-weight: 700; line-height: 1.4; }
.rx-warn svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.rx-item { border: 2px solid transparent; }
.rx-item.unsure { border-color: #efd7a6; }
.rx-item.off { opacity: .55; }
.rx-item-h { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.rx-item-h .rx-n { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: #eaf2fd; color: #2a62b5; font-weight: 900; font-size: .85rem; flex: none; }
.rx-item-h .grow { flex: 1; }
.rx-conf { font-size: .7rem; font-weight: 900; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.rx-conf.ok { background: #e8f0fb; color: #3f597a; }
.rx-conf.chk { background: #f4f7fb; color: #9a6c12; }
.rx-inc { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: .78rem; font-weight: 800; color: var(--muted); background: var(--primary-tint); min-height: 36px; }
.rx-inc .bx { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; }
.rx-inc[aria-checked="true"] { color: var(--primary-dark); }
.rx-inc[aria-checked="true"] .bx { background: var(--primary); border-color: var(--primary); color: #fff; }
.rx-inc .bx svg { width: 12px; height: 12px; }
.rx-item .field { margin: 8px 0; }
.rx-item .field input { font-weight: 800; }
.rx-item.unsure .field.unsure input { border-color: #e0b458; background: #ffffff; }
.rx-hint { font-size: .74rem; color: #9a6c12; font-weight: 800; }
.rx-ok { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; min-height: 64px; border-radius: 18px; background: var(--card); border: 2px solid var(--line); text-align: left; font-weight: 800; font-size: .95rem; box-shadow: var(--shadow); }
.rx-ok .bx { width: 30px; height: 30px; border-radius: 9px; border: 2.5px solid var(--muted); display: grid; place-items: center; flex: none; }
.rx-ok .bx svg { width: 18px; height: 18px; }
.rx-ok[aria-checked="true"] { border-color: var(--green); background: var(--green-bg); }
.rx-ok[aria-checked="true"] .bx { background: var(--green); border-color: var(--green); color: #fff; }
.rx-ok small { display: block; font-size: .76rem; color: var(--muted); font-weight: 700; }
.rx-back { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 8px 4px; font-size: .86rem; font-weight: 800; color: var(--primary-dark); }
.rx-back svg { width: 18px; height: 18px; }
html.senior .rx-paper.lg { font-size: 12px; }
html.senior .rx-btn { min-height: 68px; font-size: 1.1rem; }

/* --- senior: persistent voice command bar (sits above bottom nav) --- */
.vbar { display: none; }
html.senior .vbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: linear-gradient(160deg, #e6ecf3 0%, #f6f8fb 100%); border-top: 1.5px solid #d9e6f8; }
.vbar-mic { position: relative; width: 62px; height: 62px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 8px 18px rgba(79,111,154,.35); }
.vbar-mic svg { width: 30px; height: 30px; }
@keyframes vbBlink { 50% { opacity: .35; } }
/* voice overlay: grouped command grid */
#voiceOv .scan-status { text-align: center; }
.scan-ov#voiceOv { justify-content: flex-start; padding: 28px 20px 22px; gap: 12px; overflow: hidden; background: rgba(13,17,22,.97); }
.scan-ov#voiceOv .va-ring { width: 104px; height: 104px; }
.scan-ov#voiceOv .va-ring svg { width: 44px; height: 44px; }

/* --- dark mode for step 2f --- */
html.dark .easy-grid .hb-tile.ez-add { background: linear-gradient(160deg, #2a1f20 0%, #1a2029 100%); border-color: #4a2e31; }
html.dark .easy-grid .hb-tile.ez-add .ez-go { background: #c56b78; }
html.dark .hb-more { border-color: #36404f; }
html.dark .rx-stepper span { background: var(--card); box-shadow: none; }
html.dark .rx-stepper b { background: #2a3446; }
html.dark .rx-paper { background: #e6ecf6; }
html.dark .rx-manual, html.dark .rx-ok { background: var(--card); border-color: var(--line); box-shadow: none; }
html.dark .rx-ok[aria-checked="true"] { background: var(--green-bg); border-color: var(--green); }
html.dark .rx-warn { background: #161f2c; border-color: #5a4823; color: #e3c27e; }
html.dark .rx-item.unsure { border-color: #5a4823; }
html.dark .rx-item.unsure .field.unsure input { border-color: #a37f2e; background: #1c222a; }
html.dark .rx-hint { color: #e3b75c; }
html.dark .rx-conf.ok { background: rgba(78,104,138,.22); color: #8fa8c9; }
html.dark .rx-conf.chk { background: rgba(176,131,39,.22); color: #e3b75c; }
html.dark .rx-item-h .rx-n { background: rgba(42,98,181,.22); color: #9cc2f5; }
html.dark .rx-thumb { border-color: var(--line); }
html.dark .vbar { background: linear-gradient(160deg, #1d2735 0%, #1e2024 100%); border-top-color: #1f3a5f; }

/* =====================================================================
   STEP 2g — BARE HOME (normal mode): search → mood (fixed, top) → SOS → 6 tiles (icon + name)
   ===================================================================== */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hb-grid.easy-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.easy-grid .hb-tile { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 9px; padding: 16px 6px 14px; min-height: 108px; border-radius: 20px; }
.easy-grid .hb-tile .hm-tile-icon { width: 52px; height: 52px; border-radius: 16px; }
.easy-grid .hb-tile .hm-tile-icon svg { width: 28px; height: 28px; }
.easy-grid .hb-tile-l { font-size: .9rem; font-weight: 900; line-height: 1.15; }
.hb > .hb-mood { order: 0; }

/* ===== Step 3: catalogues ===== */
.vg { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 3px; margin-right: 7px; vertical-align: -1px; flex: none; }
.vg::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.vg.veg { color: #2e568b; }
.vg.nv { color: #b8452f; }
.vg.nv::after { border-radius: 0; width: 0; height: 0; background: none; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-bottom: 6px solid currentColor; }
.vg-tabs .tab { display: inline-flex; align-items: center; justify-content: center; }
.cat-row { padding: 10px 12px; gap: 10px; }
.cat-row .strong { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.cat-row .item-foot { margin-top: 2px; }
.ord-row { width: 100%; text-align: left; }
.ord-row .grow { display: flex; flex-direction: column; }
.ord-row .bx { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--primary); display: grid; place-items: center; background: var(--primary); color: #fff; flex: none; }
.ord-row .bx svg { width: 15px; height: 15px; }
.ord-row.off .bx { background: transparent; }
.ord-row.off { opacity: .6; }
.ord-up h1 { margin-bottom: 4px; }

/* js/store.js */
/* Sick Buddy – tiny localStorage store. All data stays on this device. */
(function () {
  const KEY = 'sickbuddy.v2';   // v2 = India edition (fresh defaults, v1 data is ignored)

  function defaults() {
    return {
      profile: {
        name: '',
        city: 'bengaluru',
        address: DATA.cities.bengaluru.address,
        emergencyNumber: '112',
        emergencyLabel: 'National emergency',
        look: { face: '🙂', accent: 'teal' },   // personal profile style (normal mode only)
      },
      contacts: JSON.parse(JSON.stringify(DATA.defaultContacts)),
      checkin: { intervalMin: 4 * 60, lastOk: Date.now(), active: true },
      cart: {},                                   // itemId -> qty
      plan: { mode: 'now', day: null, slots: [] }, // meal delivery plan: now | schedule
      orders: [],      // {id, items, fee, total, createdAt, address, scheduled?:{day, slots}}
      bookings: [],    // doctor / nurse / test / nursePackage
      chats: {},       // bookingId -> [{from, text, t}]
      moodLog: [],
      meds: [          // medicine reminders (demo, device-local): {id, name, dose, times:['HH:MM'], taken:{'YYYY-MM-DD HH:MM':ts}, snooze:{key:untilTs}}
        { id: 'm_demo', name: 'Dolo 650 (paracetamol)', dose: '1 tablet after food', times: ['08:00', '14:00', '20:00'], taken: {}, snooze: {} },
      ],
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      const parsed = JSON.parse(raw);
      const d = defaults();
      return {
        ...d, ...parsed,
        profile: { ...d.profile, ...(parsed.profile || {}) },
        checkin: { ...d.checkin, ...(parsed.checkin || {}) },
        plan: { ...d.plan, ...(parsed.plan || {}) },
      };
    } catch (e) {
      return defaults();
    }
  }

  let state = load();

  window.Store = {
    get: () => state,
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: keep in memory */ }
    },
    update(fn) { fn(state); this.save(); },
    reset() { state = defaults(); this.save(); },
    uid: (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  };
})();

</script>

(function () {
  'use strict';

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const I = window.ICONS;
  const S = () => Store.get();

  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const money = (n) => `${DATA.currency}${Number(n).toLocaleString('en-IN')}`;
  const telHref = (p) => 'tel:' + String(p).replace(/[^\d+]/g, '');
  const pad = (n) => String(n).padStart(2, '0');
  const fmtTime = (t) => new Date(t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
  const fmtDate = (t) => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const fmtDateTime = (t) => `${fmtDate(t)}, ${fmtTime(t)}`;
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const keyToDate = (k) => new Date(k + 'T00:00:00');
  const fmtDay = (k, long) => keyToDate(k).toLocaleDateString('en-IN', long ? { weekday: 'long', day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric', month: 'short' });
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const demoBadge = (text = 'Demo') => `<span class="badge-demo">${esc(text)}</span>`;

  /* ---------------- city & catalogue helpers ---------------- */
  const city = () => DATA.cities[S().profile.city] || DATA.cities.bengaluru;
  const cityLine = () => `${city().area}, ${city().name}`;
  const kitchenOf = (it) => city().kitchens[it.k || 0];

  function shopItems(shopId) {
    const shop = DATA.shops[shopId];
    if (!shop) return [];
    return shop.items;
  }
  function getItem(id) {
    for (const shopId of Object.keys(DATA.shops)) {
      const it = shopItems(shopId).find((x) => x.id === id);
      if (it) return { ...it, shop: shopId };
    }
    return null;
  }
  const discountPct = (it) => (it.mrp && it.mrp > it.price ? Math.round((1 - it.price / it.mrp) * 100) : 0);

  /* ---------------- shell: topbar, drawer, modal, toast ---------------- */
  const screen = $('#screen');
  const topbarTitle = $('#topbarTitle');
  const menuBtn = $('#menuBtn');
  const profileBtn = $('#profileBtn');
  profileBtn.innerHTML = I.user;
  $('#tbLogo').innerHTML = logoSVG(28);

  /* Senior citizen mode (demo): device-local UI preference, enlarges type & targets */
  const SENIOR_KEY = 'sickbuddy.senior';

  function cartLines() {

  function setQty(id, delta) {

  function dayOptions(n = 4) {
    const out = [];
    for (let d = 0; d < n; d++) {
      const dt = new Date(); dt.setHours(0, 0, 0, 0); dt.setDate(dt.getDate() + d);
      out.push({ key: dayKey(dt), label: d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : dt.toLocaleDateString('en-IN', { weekday: 'short' }), sub: fmtDate(dt) });
    }
    return out;
  }
  const todayKey = () => dayKey(new Date());
  function timePassed(day, hourFloat, leadMin = 60) {
    if (day !== todayKey()) return day < todayKey();
    const t = new Date(); t.setHours(Math.floor(hourFloat), Math.round((hourFloat % 1) * 60), 0, 0);
    return t.getTime() < Date.now() + leadMin * 60000;
  }
  const mealSlotPassed = (day, slotId) => timePassed(day, DATA.mealSlots.find((s) => s.id === slotId).start, 60);
  const timeSlotPassed = (day, hhmm) => { const [h, m] = hhmm.split(':').map(Number); return timePassed(day, h + m / 60, 60); };
  const fmtSlot = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); const d = new Date(); d.setHours(h, m); return fmtTime(d); };

  function ensurePlanDay() {
    const p = S().plan;
    if (!p.day || p.day < todayKey()) {
      const days = dayOptions();
      const todayOk = DATA.mealSlots.some((sl) => !mealSlotPassed(days[0].key, sl.id));
      Store.update((s) => { s.plan.day = todayOk ? days[0].key : days[1].key; s.plan.slots = []; });
    }
    Store.update((s) => { s.plan.slots = s.plan.slots.filter((id) => !mealSlotPassed(s.plan.day, id)); });
  }

  /* Pricing rule (shown to the user):
     - "Now": 1 delivery.
     - "Schedule": meals repeat at every chosen slot; meds & hygiene come with the first delivery.
     - Delivery ₹20 per delivery, FREE when that delivery is ₹199 or more. */
  function quote() {
    const lines = cartLines();
    const plan = S().plan;
    const foodSub = lines.filter((l) => l.item.shop === 'food').reduce((a, l) => a + l.item.price * l.qty, 0);
    const otherSub = lines.filter((l) => l.item.shop !== 'food').reduce((a, l) => a + l.item.price * l.qty, 0);
    const mrpSaving = 0;
    const scheduled = plan.mode === 'schedule' && foodSub > 0;
    const slots = scheduled ? DATA.mealSlots.filter((s) => plan.slots.includes(s.id)) : [];
    const n = scheduled ? Math.max(slots.length, 1) : 1;
    const deliveries = [];
    for (let i = 0; i < n; i++) {
      const sub = foodSub + (i === 0 ? otherSub : 0);
      deliveries.push({ label: scheduled ? (slots[i] ? slots[i].label : 'Pick a slot') : 'Now', sub, fee: sub >= DATA.freeDeliveryAbove ? 0 : DATA.deliveryFee });
    }
    const itemsTotal = foodSub * n + otherSub;
    const fee = deliveries.reduce((a, d) => a + d.fee, 0);
    const firstSub = deliveries[0] ? deliveries[0].sub : 0;
    return { lines, foodSub, otherSub, mrpSaving, n, deliveries, itemsTotal, fee, total: itemsTotal + fee, scheduled, slots, firstSub,
      toFree: Math.max(0, DATA.freeDeliveryAbove - firstSub), ready: !scheduled || slots.length > 0 };
  }

  function searchIndex() {

  /* ---------- Voice assistance (senior mode, demo): listen → match a simple command → navigate ---------- */

    { id: 'orders', g: 'Go to', label: 'My orders', k: ['orders', 'my orders', 'bookings', 'my bookings', 'order'], go: '#/activity', say: 'Opening your orders and bookings' },
    { id: 'addmed', g: 'Medicines', label: 'Add medicine', k: ['add medicine', 'add med', 'add meds', 'add medicines', 'add tablet', 'new medicine', 'scan prescription', 'upload prescription', 'prescription'], go: '#/meds/add', say: 'Opening add medicine. Take a photo of your prescription.' },
    { id: 'reminder', g: 'Medicines', label: 'Med reminder', k: ['reminder', 'reminders', 'med reminder', 'medicine reminder', 'remind', 'dose', 'pill', 'pills', 'my medicines', 'my medicine'], go: '#/reminders', say: 'Opening medicine reminders' },
    { id: 'taken', g: 'Medicines', label: 'I took my medicine', k: ['taken', 'i took', 'took my medicine', 'mark taken', 'medicine taken', 'i took my medicine'], run: () => { const nd = nextDose(); if (!nd || (nd.state !== 'due' && nd.state !== 'snoozed')) return 'No dose is due right now'; Store.update((st) => { const m = st.meds.find((x) => x.id === nd.med.id); if (m) { m.taken = m.taken || {}; m.taken[nd.key] = Date.now(); } }); rerender(); return `Marked ${nd.med.name} as taken`; }, say: 'Marking your dose as taken' },
    { id: 'okay', g: 'Safety', label: 'I’m okay', k: ['i m okay', 'i am okay', 'im okay', 'i am fine', 'i m fine', 'okay', 'check in'], run: () => { Store.update((st) => { st.checkin.lastOk = Date.now(); st.checkin.active = true; }); rerender(); return 'Check-in done. Glad you are okay'; }, say: 'Check-in done' },
    { id: 'contacts', g: 'Safety', label: 'Contacts', k: ['contacts', 'contact', 'family', 'emergency contacts'], go: '#/contacts', say: 'Opening emergency contacts' },
    { id: 'checkins', g: 'Safety', label: 'Check-ins', k: ['check ins', 'checkins', 'checkin timer', 'check in timer'], go: '#/checkins', say: 'Opening check-ins' },
    { id: 'tests', g: 'More', label: 'Tests', k: ['tests', 'test', 'lab', 'report', 'reports'], go: '#/tests', say: 'Opening tests and reports' },
    { id: 'hygiene', g: 'More', label: 'Hygiene', k: ['hygiene', 'tissue', 'mask', 'sanitiser', 'sanitizer'], go: '#/shop/hygiene', say: 'Opening hygiene goods' },
    { id: 'log', g: 'More', label: 'Feeling log', k: ['feeling log', 'mood', 'feeling', 'log'], go: '#/log', say: 'Opening your feeling log' },
    { id: 'darkon', g: 'Settings', label: 'Dark mode', k: ['dark mode', 'dark', 'night mode', 'dark mode on', 'turn on dark mode'], run: () => { if (!darkOn()) setDark(true); return 'Dark mode on'; }, say: 'Dark mode on' },
    { id: 'darkoff', g: 'Settings', label: 'Light mode', k: ['light mode', 'light', 'day mode', 'dark mode off', 'turn off dark mode'], run: () => { if (darkOn()) setDark(false); return 'Light mode on'; }, say: 'Light mode on' },
    { id: 'back', g: 'Settings', label: 'Go back', k: ['back', 'go back', 'peeche'], run: () => { if (navDepth > 0) { goingBack = true; history.back(); } else location.replace('#/'); return 'Going back'; }, say: 'Going back' },
    { id: 'menu', g: 'Settings', label: 'Menu', k: ['menu', 'open menu'], run: () => { openMenu(); return 'Menu open'; }, say: 'Opening the menu' },
    { id: 'seniorOff', g: 'Settings', label: 'Senior mode off', k: ['senior mode off', 'normal mode', 'exit senior mode', 'turn off senior mode'], run: () => { setSenior(false); rerender(); return 'Senior mode off'; }, say: 'Turning senior mode off' },
  ];
  const VA_PHRASES = VA_CMDS.flatMap((c) => c.k.map((p) => [p, c])).sort((a, b) => b[0].length - a[0].length);
  let vaRec = null, vaTimer = null;
  function vaSpeak(text) { try { const ss = window.speechSynthesis; if (!ss) return; ss.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-IN'; u.rate = 0.9; ss.speak(u); } catch (e) {} }
  function vaMatch(text) {
    const t = ' ' + String(text).toLowerCase().replace(/[’']/g, ' ').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').replace(/\bs o s\b/g, 'sos').trim() + ' ';
    const hit = VA_PHRASES.find(([p]) => t.includes(' ' + p + ' ') || t.includes(' ' + p + 's '));
    return hit ? hit[1] : null;
  }
  /* Step 3f — simple senior voice: tap → listen once → show what was heard → go → stop. No always-listen. */
  function vaRun(c) {
    let msg = c.say;
    if (c.run) { const r = c.run(); if (r) msg = r; } else go(c.go);
    vaSpeak(msg);
  }
  function vaStop() {
    clearTimeout(vaTimer); vaTimer = null;
    if (vaRec) { const r = vaRec; vaRec = null; r.onresult = r.onerror = r.onend = null; try { r.abort(); } catch (e) {} }
  }
  function closeVoiceAssist() { vaStop(); const ov = $('#voiceOv'); if (ov) ov.remove(); }
  function vaShow(state, heard, status) {
    const ov = $('#voiceOv'); if (!ov) return;
    ov.dataset.state = state;
    $('#vaRing').classList.toggle('on', state === 'listen');
    $('#vaHeard').textContent = heard || '';
    $('#vaStatus').textContent = status || '';
    $('#vaRetry').hidden = state !== 'err';
  }
  function openVoiceAssist() {
    closeScanner(); closeVoiceAssist();
    const ov = document.createElement('div');
    ov.className = 'scan-ov va-simple'; ov.id = 'voiceOv';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Speak');
    ov.innerHTML = `
      <button type="button" class="va-ring on" id="vaRing" data-action="va-retry" aria-label="Tap & speak" data-testid="va-mic">${I.mic}</button>
      <div class="va-heard" id="vaHeard" aria-live="polite"></div>
      <div class="va-status" id="vaStatus" aria-live="polite">Listening…</div>
      <div class="scan-acts">
        <button type="button" class="btn btn-ghost" data-action="va-close" data-testid="va-close">Close</button>
        <button type="button" class="btn btn-primary" id="vaRetry" data-action="va-retry" data-testid="va-retry" hidden>Try again</button>
      </div>`;
    document.body.appendChild(ov);
    vaListen();
  }
  function vaListen() {
    if (!$('#voiceOv')) return;
    vaStop();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return vaShow('err', '', 'Mic unavailable');
    try {
      const r = new SR(); vaRec = r;
      r.lang = 'en-IN'; r.continuous = false; r.interimResults = false; r.maxAlternatives = 3;
      let done = false;
      r.onresult = (e) => {
        if (vaRec !== r) return; done = true; vaRec = null;
        const alts = [...(e.results[0] || [])].map((a) => String(a.transcript || '').trim()).filter(Boolean);
        if (!alts.length) return vaShow('err', '', 'Try again');
        const said = alts.find((a) => vaMatch(a)) || alts[0];
        const c = vaMatch(said);
        if (!c) return vaShow('err', `“${said}”`, 'Try again');
        vaShow('go', `“${said}”`, c.label);
        vaTimer = setTimeout(() => { closeVoiceAssist(); vaRun(c); }, 900);
      };
      r.onerror = (e) => {
        if (vaRec !== r) return; done = true; vaRec = null;
        const err = e && e.error;
        vaShow('err', '', (err === 'no-speech' || err === 'aborted' || err === 'no-match') ? 'Try again' : 'Mic unavailable');
      };
      r.onend = () => { if (vaRec !== r) return; vaRec = null; if (!done) vaShow('err', '', 'Try again'); };
      vaShow('listen', '', 'Listening…');
      r.start();
    } catch (e) { vaRec = null; vaShow('err', '', 'Mic unavailable'); }
  }

          <span class="status-pill sim" data-sim-status data-delay="${800 + i * 1000}">Sending…</span>

  /* ---------- SHOPS ---------- */
  function itemPrice(it) {
    return `<span class="price">${it.priceLabel ? esc(it.priceLabel) : money(it.price)}</span>${it.unit ? `<span class="small muted">${esc(it.unit)}</span>` : ''}`;

  /* Step 3: bare catalogues. Food = veg / non-veg filter. Meds = scan prescription first, catalogue below. */
  let foodVeg = true;
  const shopRow = (it) => {

            <div class="item-foot">${itemPrice(it)}</div>
          </div>
          ${q ? `<div class="qty">
              <button class="qty-btn" data-action="qty" data-id="${it.id}" data-d="-1" aria-label="Remove one">${I.minus}</button>

  };
  views.shop = (id) => {
    const shop = DATA.shops[id];
    if (!shop) return views.notFound();
    if (id === 'meds') return medsShop();
    setTopbar({ title: id === 'food' ? 'Food' : shop.title, back: true });
    if (id === 'food') {
      const list = shop.items.filter((it) => it.veg === foodVeg);
      return `
    <div class="tabs vg-tabs" role="tablist" aria-label="Food type" data-testid="food-filter">
      <button class="tab ${foodVeg ? 'on' : ''}" role="tab" aria-selected="${foodVeg}" data-action="food-veg" data-v="1" data-testid="filter-veg"><span class="vg veg"></span>Veg</button>
      <button class="tab ${!foodVeg ? 'on' : ''}" role="tab" aria-selected="${!foodVeg}" data-action="food-veg" data-v="0" data-testid="filter-nonveg"><span class="vg nv"></span>Non-veg</button>

  /* Meds: scan → found (pre-ticked) → Add to cart. Demo scan, matched to the catalogue. */
  const ORD_DEMO = () => ([{ id: 'm1', on: true }, { id: 'm10', on: true }, { id: 'm5', on: true }]);
  let ord = { step: 'start', img: null, items: null };
  let ordTimer = null;
  const ordPaper = (cls = '') => `<div class="rx-paper ${cls}" aria-hidden="true">
      <div class="rp-h"><span><b>Sunrise Clinic</b>Dr. Meera Iyer, MBBS</span><span>${fmtDate(Date.now())}</span></div>
      <div class="rp-rx">℞</div>
      <div class="rp-l">1. Tab Dolo 650 — 1-0-1 × 3d</div>
      <div class="rp-l">2. Cap Amoxy 150 — 1-1-1 × 5d</div>
      <div class="rp-l">3. Cough syrup — 5 ml HS</div>
      <div class="rp-sig">M. Iyer</div>
    </div>`;
  function ordStart(img) {
    ord = { step: 'scan', img, items: null };

      ${q.otherSub ? `<div class="sum-row"><span>Meds & hygiene</span><span>${money(q.otherSub)}</span></div>` : ''}
      ${q.deliveries.map((d) => `<div class="sum-row"><span>Delivery${q.scheduled ? ` · ${esc(d.label)}` : ''}</span><span>${d.fee ? money(d.fee) : '<span class="free">FREE</span>'}</span></div>`).join('')}

    </section>

      <div class="card-head"><h2>${I.pin} Deliver to</h2><a class="link" href="#/profile">Change</a></div>

    <p class="footnote">Demo checkout – nothing is really ordered or charged.</p>`;
  };

  const STAGES = [
    { label: 'Order confirmed', sub: 'The kitchen / store got your order', at: 0 },

  const stageOf = (o) => { const sec = (Date.now() - o.createdAt) / 1000; let i = 0; STAGES.forEach((st, k) => { if (sec >= st.at) i = k; }); return i; };

  /* ---------- BOOKING building blocks ---------- */
  function dayPicker(action, selected, n = 4, multi = false) {

    const days = dayOptions();

  const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- DOCTOR (home visit or video) & LAB TESTS ---------- */

    const c = city();
    const mode = DATA.doctor.modes.find((m) => m.id === draft.mode);
    const base = isTest ? test.price : mode.price;

    return `

    <section class="card">

      out.push({ key: dayKey(dt), label: d === 1 ? 'Tomorrow' : dt.toLocaleDateString('en-IN', { weekday: 'short' }), sub: fmtDate(dt) });

    return out;
