  };

  /* ================================================================
     ROUTER
     ================================================================ */
  let currentRoute = '';
  const parse = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  function render(keepScroll = false) {
    const parts = parse();
    const [a, b, c] = parts;
    const route = parts.join('/');
    const scroll = screen.scrollTop;
    let html;
    let cartbar = false;
    switch (a) {
      case undefined: html = views.home(); break;
      case 'contacts': html = views.contacts(); break;
      case 'checkins': html = views.checkins(); break;
      case 'missed': html = views.missed(); break;
      case 'sos': html = b === 'active' ? views.sosActive() : views.sos(); break;
      case 'shop': html = views.shop(b); cartbar = true; break;
      case 'cart': html = views.cart(); break;
      case 'track': html = views.track(b); break;
      case 'book': html = views.book(b, c); break;
      case 'nurse': html = views.nurse(); break;
      case 'cleaning': html = views.cleaning(); break;
      case 'chat': html = views.chat(b); break;
      case 'booking': html = views.booking(b); break;
      case 'tests': html = views.tests(); break;
      case 'report': html = views.report(b); break;
      case 'log': html = views.log(); break;
      case 'meds': html = views.medsAdd(); break;
      case 'reminders': html = views.reminders(); break;
      case 'activity': html = views.activity(); break;
      case 'profile': html = views.profile(); break;
      case 'about': html = views.about(); break;
      default: html = views.notFound();
    }
    if (route !== parse().join('/')) return; // a view redirected; hashchange re-renders
    if (a !== 'meds' && rx.step !== 'upload') { clearTimeout(rxTimer); rx = freshRx(); }
    screen.classList.toggle('is-home', a === undefined);
    screen.innerHTML = `<div class="view">${html}</div>`;
    renderCartBar(cartbar);
    renderBottomNav(a);
    renderVoiceBar();
    if (keepScroll && route === currentRoute) screen.scrollTop = scroll;
    else screen.scrollTop = 0;
    currentRoute = route;
    if (a === 'chat') screen.scrollTop = screen.scrollHeight;
    runSimStatuses();
  }
  const rerender = () => render(true);
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  let simTimers = [];
  function runSimStatuses() {
    simTimers.forEach(clearTimeout); simTimers = [];
    $$('[data-sim-status]').forEach((el) => {
      const delay = Number(el.dataset.delay || 1000);
      simTimers.push(setTimeout(() => { el.textContent = el.textContent.startsWith('Sharing') ? 'Shared (demo)' : 'Notified (demo)'; el.classList.add('ok'); }, delay));
    });
  }

  /* ================================================================
     EVENTS
     ================================================================ */
  function saveNotes() {
    const n = $('#bookNotes'); if (n && draft) draft.notes = n.value;
    const m = $('#nurseNotes'); if (m && nurseDraft) nurseDraft.notes = m.value;
    const cn = $('#cleanNotes'); if (cn && cleanDraft) cleanDraft.notes = cn.value;
  }
  const toggleIn = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

  document.addEventListener('click', (e) => {
    const goEl = e.target.closest('[data-go]');
    if (goEl) { e.preventDefault(); closeMenu(); go(goEl.dataset.go); return; }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    const s = S();

    switch (act) {
      case 'open-menu': openMenu(); break;
      case 'dark-toggle': e.preventDefault(); setDark(!darkOn()); break;
      case 'senior-toggle': setSenior(!seniorOn()); if (parse()[0] === 'profile' || !parse().length) rerender(); break;
      case 'voice-assist': e.preventDefault(); openVoiceAssist(); break;
      case 'look-face': case 'look-accent': {
        if (seniorOn()) break;   // customizer is normal-mode only
        const k = act === 'look-face' ? 'face' : 'accent';
        Store.update((st) => { st.profile.look = { ...look(), [k]: el.dataset.v }; });
        applyLook();
        $$(`[data-action="${act}"]`).forEach((b) => { const on = b.dataset.v === el.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
        if ($('#pfFace')) $('#pfFace').textContent = look().face;
        if ($('#pfAccentTag')) $('#pfAccentTag').lastChild.textContent = `${LOOK_ACCENTS[look().accent].n} theme`;
        toast(k === 'face' ? `Profile face saved ${look().face}` : `${LOOK_ACCENTS[look().accent].n} colour saved`); break;
      }
      case 'dark-toggle-pf': setDark(!darkOn()); rerender(); break;
      case 'rx-demo': e.preventDefault(); rxStart(null); break;
      case 'rx-rescan': case 'rx-upload': clearTimeout(rxTimer); rx = freshRx(); rerender(); break;
      case 'med-manual': clearTimeout(rxTimer); rx = { ...freshRx(), step: 'manual' }; rerender(); break;
      case 'rx-inc': { const it = rx.items[+el.dataset.i]; it.on = !it.on; rx.ok = false; rerender(); break; }
      case 'rx-time': { const it = rx.items[+el.dataset.i]; const t = el.dataset.t; it.times = it.times.includes(t) ? it.times.filter((x) => x !== t) : it.times.concat(t).sort(); rx.ok = false; rerender(); break; }
      case 'rx-ok': rx.ok = !rx.ok; rxSyncSave(); break;
      case 'rx-save': {
        const items = (rx.items || []).filter((x) => x.on);
        if (!rx.ok) { toast('Please tick “I’ve checked these details” first'); break; }
        const bad = items.find((x) => !x.name.trim() || !x.times.length);
        if (bad) { toast(!bad.name.trim() ? 'A medicine name is empty' : `Pick a time for ${bad.name}`); break; }
        Store.update((st) => { st.meds = st.meds || []; items.forEach((x) => st.meds.push({ id: Store.uid('m'), name: x.name.trim(), dose: x.dose.trim() || '1 dose', times: [...new Set(x.times)].sort(), taken: {}, snooze: {} })); });
        toast(`Saved ${plural(items.length, 'medicine')} – reminders set`); rx = freshRx(); go('#/reminders'); break;
      }
      case 'va-retry': e.preventDefault(); vaListen(); break;
      case 'va-close': e.preventDefault(); closeVoiceAssist(); break;
      case 'med-time': {
        const t = el.dataset.t; medDraftTimes = medDraftTimes || [];
        medDraftTimes = medDraftTimes.includes(t) ? medDraftTimes.filter((x) => x !== t) : medDraftTimes.concat(t);
        const keep = { n: $('#medName').value, d: $('#medDose').value }; rerender(); $('#medName').value = keep.n; $('#medDose').value = keep.d; break;
      }
      case 'med-time-add': {
        const t = $('#medCustom').value; if (!/^\d{2}:\d{2}$/.test(t)) { toast('Pick a time first'); break; }
        medDraftTimes = medDraftTimes || []; if (!medDraftTimes.includes(t)) medDraftTimes.push(t);
        const keep = { n: $('#medName').value, d: $('#medDose').value }; rerender(); $('#medName').value = keep.n; $('#medDose').value = keep.d; break;
      }
      case 'med-save': {
        const name = $('#medName').value.trim(), dose = $('#medDose').value.trim();
        if (!name) { toast('Enter the medicine name'); $('#medName').focus(); break; }
        if (!medDraftTimes || !medDraftTimes.length) { toast('Choose at least one time'); break; }
        const times = [...new Set(medDraftTimes)].sort();
        Store.update((st) => { st.meds = st.meds || []; st.meds.push({ id: Store.uid('m'), name, dose: dose || '1 dose', times, taken: {}, snooze: {} }); });
        medDraftTimes = null; toast(`Saved – reminders at ${times.map(fmtHM).join(', ')}`); go('#/reminders'); break;
      }
      case 'med-taken': {
        e.preventDefault();
        Store.update((st) => { const m = (st.meds || []).find((x) => x.id === el.dataset.med); if (m) { m.taken = m.taken || {}; m.taken[el.dataset.key] = Date.now(); if (m.snooze) delete m.snooze[el.dataset.key]; } });
        toast('Marked as taken ✓'); rerender(); break;
      }
      case 'med-snooze': {
        Store.update((st) => { const m = (st.meds || []).find((x) => x.id === el.dataset.med); if (m) { m.snooze = m.snooze || {}; m.snooze[el.dataset.key] = Date.now() + 10 * 60 * 1000; } });
        toast('Snoozed – we’ll remind you in 10 min (demo)'); rerender(); break;
      }
      case 'med-del': {
        const m = (s.meds || []).find((x) => x.id === el.dataset.med); if (!m) break;
        confirmModal({ title: 'Remove medicine?', body: `Stop reminders for ${esc(m.name)}.`, ok: 'Remove', danger: true }, () => {
          Store.update((st) => { st.meds = st.meds.filter((x) => x.id !== m.id); }); closeModal(); toast('Removed'); rerender();
        }); break;
      }
      case 'scan-search': e.preventDefault(); openScanner(); break;
      case 'scan-cancel': e.preventDefault(); closeScanner(); break;
      case 'scan-demo': e.preventDefault(); demoScan(); break;
      case 'search-clear': e.preventDefault(); $('#hbSearch').value = ''; renderSearch(); $('#hbSearch').focus(); break;
      case 'close-menu': closeMenu(); break;
      case 'back':
        if (navDepth > 0) { goingBack = true; history.back(); } else location.replace('#/');
        break;
      case 'modal-close': closeModal(); break;
      case 'modal-ok': if (modalOnSubmit) modalOnSubmit(); break;
      case 'toggle-chip': el.classList.toggle('on'); break;

      case 'city-picker': openCityPicker(); break;
      case 'set-city': setCity(el.dataset.v); break;

      case 'mood': openMoodModal(Number(el.dataset.v)); break;

      case 'contact-add': contactForm(null); break;
      case 'contact-edit': contactForm(s.contacts.find((c) => c.id === el.dataset.id)); break;
      case 'contact-del': {
        const c = s.contacts.find((x) => x.id === el.dataset.id);
        confirmModal({ title: `Delete ${c.name}?`, body: 'They will no longer be alerted.', ok: 'Delete', danger: true }, () => {
          Store.update((st) => { st.contacts = st.contacts.filter((x) => x.id !== c.id); });
          closeModal(); toast('Contact deleted'); rerender();
        });
        break;
      }

      case 'checkin-interval':
        Store.update((st) => { st.checkin.intervalMin = Number(el.dataset.v); st.checkin.lastOk = Date.now(); });
        toast('Check-in interval updated'); rerender(); break;
      case 'checkin-ok':
        Store.update((st) => { st.checkin.lastOk = Date.now(); st.checkin.active = true; });
        toast("Great – glad you're okay! 💙");
        if (el.dataset.after) go(el.dataset.after); else rerender();
        break;
      case 'checkin-toggle':
        Store.update((st) => { st.checkin.active = !st.checkin.active; if (st.checkin.active) st.checkin.lastOk = Date.now(); });
        rerender(); break;
      case 'simulate-missed':
        Store.update((st) => { st.checkin.active = true; st.checkin.lastOk = Date.now() - st.checkin.intervalMin * 60000 - 1000; });
        go('#/missed'); break;

      case 'sos':
        sosAt = Date.now(); go('#/sos/active');
        break;
      case 'sos-cancel':
        confirmModal({ title: 'Cancel SOS?', body: "We'd tell your contacts you're safe (simulated).", ok: "I'm safe", cancel: 'Keep SOS' }, () => {
          closeModal(); sosAt = null; toast('SOS cancelled – contacts told you are safe (demo)'); go('#/');
        });
        break;

      /* shop & cart */
      case 'qty': setQty(el.dataset.id, Number(el.dataset.d)); rerender(); break;
      case 'plan-mode': Store.update((st) => { st.plan.mode = el.dataset.v; }); rerender(); break;
      case 'plan-day': Store.update((st) => { st.plan.day = el.dataset.v; }); ensurePlanDay(); rerender(); break;
      case 'plan-slot': Store.update((st) => { st.plan.slots = toggleIn(st.plan.slots, el.dataset.v); }); rerender(); break;
      case 'checkout': {
        const q = quote();
        if (!q.lines.length || !q.ready) return;
        const id = Store.uid('o');
        const leave = $('#leaveDoor') ? $('#leaveDoor').checked : true;
        const lines = q.lines.map(({ id: iid, qty, item }) => ({ id: iid, qty, name: item.name, price: item.price, shop: item.shop, kitchen: item.shop === 'food' ? kitchenOf(item).name : '' }));
        Store.update((st) => {
          st.orders.unshift({
            id, lines, n: q.n, fee: q.fee, total: q.total, createdAt: Date.now(), address: st.profile.address, city: st.profile.city, leaveAtDoor: leave,
            scheduled: q.scheduled ? { day: st.plan.day, slots: st.plan.slots.slice() } : null,
          });
          st.cart = {};
          st.plan = { mode: 'now', day: null, slots: [] };
        });
        go('#/track/' + id);
        break;
      }
      case 'cancel-order':
        confirmModal({ title: 'Cancel scheduled order?', body: 'The kitchen will be told not to cook it (demo).', ok: 'Cancel order', cancel: 'Keep it', danger: true }, () => {
          Store.update((st) => { const o = st.orders.find((x) => x.id === el.dataset.id); if (o) o.cancelled = true; });
          closeModal(); toast('Scheduled order cancelled (demo)'); rerender();
        });
        break;

      /* doctor / test booking */
      case 'doc-mode': saveNotes(); draft.mode = el.dataset.v; rerender(); break;
      case 'book-need': saveNotes(); draft.needs = toggleIn(draft.needs, el.dataset.v); rerender(); break;
      case 'book-day': saveNotes(); draft.day = el.dataset.v; if (draft.slot && timeSlotPassed(draft.day, draft.slot)) draft.slot = null; rerender(); break;
      case 'book-slot': saveNotes(); draft.slot = el.dataset.v; rerender(); break;
      case 'book-confirm': {
        if (!draft || !draft.needs.length || !draft.slot) return;
        saveNotes();
        const c = city();
        const isTest = draft.type === 'test';
        const test = isTest ? DATA.labTests.find((t) => t.id === draft.testId) : null;
        const base = isTest ? test.price : DATA.doctor.modes.find((m) => m.id === draft.mode).price;
        const id = Store.uid('b');
        Store.update((st) => {
          st.bookings.unshift({
            id, type: draft.type, mode: isTest ? null : draft.mode, needs: draft.needs.slice(), day: draft.day, slot: draft.slot, notes: draft.notes,
            staff: isTest ? c.lab : pickOne(c.doctors), base, fee: DATA.bookingFee, price: base + DATA.bookingFee,
            address: st.profile.address, city: st.profile.city, createdAt: Date.now(),
          });
        });
        draft = null;
        go('#/booking/' + id);
        break;
      }
      case 'join-video': toast('The video call would open here 10 min before your slot (demo)'); break;

      /* cleaning (pre-book only) */
      case 'clean-day': saveNotes(); cleanDraft.day = el.dataset.v; rerender(); break;
      case 'clean-slot': saveNotes(); cleanDraft.slot = el.dataset.v; rerender(); break;
      case 'clean-task': saveNotes(); cleanDraft.tasks = toggleIn(cleanDraft.tasks, el.dataset.v); rerender(); break;
      case 'clean-review': saveNotes(); if (cleanDraft && cleanDraft.slot && cleanDraft.tasks.length) cleanConfirmModal(); break;

      /* nurse */
      case 'nurse-tab': saveNotes(); nurseDraft.tab = el.dataset.v; rerender(); break;
      case 'nurse-level': saveNotes(); nurseDraft.level = el.dataset.v; rerender(); break;
      case 'nurse-day': saveNotes(); nurseDraft.days = toggleIn(nurseDraft.days, el.dataset.v).sort(); rerender(); break;
      case 'nurse-need': saveNotes(); nurseDraft.needs = toggleIn(nurseDraft.needs, el.dataset.v); rerender(); break;
      case 'pkg-days': saveNotes(); nurseDraft.pkgDays = Math.min(30, Math.max(2, nurseDraft.pkgDays + Number(el.dataset.d))); rerender(); break;
      case 'pkg-start': saveNotes(); nurseDraft.pkgStart = el.dataset.v; rerender(); break;
      case 'nurse-confirm': {
        saveNotes();
        const d = nurseDraft;
        if (!d.days.length || !d.needs.length) return;
        const lvl = DATA.nurse.levels.find((l) => l.id === d.level);
        const id = Store.uid('b');
        Store.update((st) => {
          st.bookings.unshift({
            id, type: 'nurse', level: d.level, days: d.days.slice(), needs: d.needs.slice(), notes: d.notes,
            staff: pickOne(city().nurses.filter((n) => (d.level === 'assist' ? /assistant/i.test(n) : /^Nurse/.test(n)))),
            base: lvl.price * d.days.length, fee: 0, price: lvl.price * d.days.length,
            address: st.profile.address, city: st.profile.city, createdAt: Date.now(),
          });
        });
        nurseDraft = null;
        go('#/booking/' + id);
        break;
      }
      case 'pkg-request': {
        saveNotes();
        const d = nurseDraft;
        if (!d.needs.length) return;
        const lvl = DATA.nurse.levels.find((l) => l.id === d.level);
        const staff = pickOne(city().nurses.filter((n) => (d.level === 'assist' ? /assistant/i.test(n) : /^Nurse/.test(n))));
        const id = Store.uid('b');
        const now = Date.now();
        const offer = Math.round((lvl.price * d.pkgDays * 0.9) / 100) * 100; // example opening offer from the nurse
        Store.update((st) => {
          st.bookings.unshift({
            id, type: 'nursePackage', level: d.level, pkgDays: d.pkgDays, day: d.pkgStart, needs: d.needs.slice(), notes: d.notes,
            staff, status: 'requested', price: 0, address: st.profile.address, city: st.profile.city, createdAt: now,
          });
          st.chats[id] = [
            { from: 'system', text: `Request sent to nurses near ${city().area} (demo). A nurse will contact you to discuss the price.`, t: now },
            { from: 'me', text: `Hi! I need a ${lvl.label.toLowerCase()} for ${d.pkgDays} days from ${fmtDay(d.pkgStart)}: ${d.needs.join(', ')}.${d.notes ? ' ' + d.notes : ''}`, t: now + 100 },
            { from: 'nurse', text: `Namaste! I'm ${staff.replace(/\.$/, '')}. I saw your ${d.pkgDays}-day request and I'd be happy to help. For all ${d.pkgDays} days I can do ${money(offer)} in total (example offer). Does that work, or shall we discuss?`, offer, t: now + 2200 },
          ];
        });
        nurseDraft = null;
        go('#/chat/' + id);
        break;
      }
      case 'pkg-accept': {
        const id = el.dataset.id; const price = Number(el.dataset.v);
        Store.update((st) => {
          const b = st.bookings.find((x) => x.id === id);
          b.status = 'agreed'; b.agreedPrice = price; b.price = price;
          st.chats[id].push({ from: 'system', text: `Package agreed at ${money(price)} for ${b.pkgDays} days ✓ (demo – nothing is charged)`, t: Date.now() });
        });
        pushNurseReply(id, "Great, thank you! I'll come on the first day at 9 AM. Get some rest till then 🙂", null, 1200);
        rerender();
        break;
      }
      case 'fake-call': toast('Would call the nurse here (demo – no real number)'); break;

      case 'tests-tab': testsTab = el.dataset.v; rerender(); break;
      case 'food-veg': foodVeg = el.dataset.v === '1'; rerender(); break;
      case 'ord-demo': e.preventDefault(); ordStart(null); break;
      case 'ord-rescan': clearTimeout(ordTimer); ord = { step: 'start', img: null, items: null }; rerender(); break;
      case 'ord-inc': { const x = ord.items[+el.dataset.i]; x.on = !x.on; rerender(); break; }
      case 'ord-add': {
        const ids = ord.items.filter((x) => x.on).map((x) => x.id);
        ids.forEach((iid) => setQty(iid, 1));
        ord = { step: 'start', img: null, items: null };
        toast(`Added ${plural(ids.length, 'item')}`); go('#/cart'); break;
      }
      case 'share-report': toast('Shared with your doctor (demo – nothing sent)'); break;

      case 'emer-preset': $('#pEmer').value = el.dataset.n; $('#pEmerLabel').value = el.dataset.l; break;
      case 'profile-save': {
        const name = $('#pName').value.trim();
        const address = $('#pAddr').value.trim() || city().address;
        const num = $('#pEmer').value.trim().replace(/[^\d+]/g, '');
        if (!num) { toast('Please enter an emergency number'); return; }
        Store.update((st) => { Object.assign(st.profile, { name, address, emergencyNumber: num, emergencyLabel: $('#pEmerLabel').value.trim() || `Emergency (${num})` }); });
        toast('Settings saved'); rerender(); break;
      }
      case 'reset':
        confirmModal({ title: 'Reset demo data?', body: 'Contacts, orders, bookings and your log will go back to the examples.', ok: 'Reset', danger: true }, () => {
          Store.reset(); draft = null; nurseDraft = null; cleanDraft = null; closeModal(); toast('Demo data reset'); go('#/');
        });
        break;
    }
  });

  /* simulated package chat */
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form="chat"]');
    if (!f) return;
    e.preventDefault();
    const input = $('#chatText');
    const text = input.value.trim();
    if (!text) return;
    const id = f.dataset.id;
    const b = S().bookings.find((x) => x.id === id);
    Store.update((s) => { (s.chats[id] = s.chats[id] || []).push({ from: 'me', text, t: Date.now() }); });
    const m = text.replace(/,/g, '').match(/(\d{3,6})/);
    if (b && b.status !== 'agreed' && m) {
      const ask = Number(m[1]);
      const lvl = DATA.nurse.levels.find((l) => l.id === b.level);
      const floor = Math.round((lvl.price * b.pkgDays * 0.75) / 100) * 100;
      const counter = Math.max(ask, floor);
      pushNurseReply(id, counter === ask ? `Okay, ${money(ask)} for ${b.pkgDays} days works for me.` : `${money(ask)} is a bit low for me. Can we meet at ${money(counter)}?`, counter);
    } else if (b && b.status !== 'agreed') {
      pushNurseReply(id, 'Sure! Suggest a total price for the package, or accept my offer above. (simulated reply)');
    } else {
      pushNurseReply(id, 'Noted! See you soon. (simulated reply)');
    }
    rerender();
  });

  $('#modalWrap').addEventListener('click', (e) => { if (e.target.id === 'modalWrap') closeModal(); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'hbSearch') renderSearch();
    const f = e.target.dataset && e.target.dataset.rxField;
    if (f && rx.items) { rx.items[+e.target.dataset.i][f] = e.target.value; if (rx.ok) { rx.ok = false; rxSyncSave(); toast('Edited – please tick “I’ve checked” again'); } }
  });
  document.addEventListener('change', (e) => {
    if (!e.target.matches || !e.target.matches('[data-ord-file]')) return;
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (!/^image\//.test(file.type)) { toast('Please choose a photo'); return; }
    const rd = new FileReader();
    rd.onload = () => ordStart(rd.result);
    rd.readAsDataURL(file);
  });
  document.addEventListener('change', (e) => {
    if (!e.target.matches || !e.target.matches('[data-rx-file]')) return;
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (!/^image\//.test(file.type)) { toast('Please choose a photo (image)'); return; }
    const rd = new FileReader();
    rd.onload = () => rxStart(rd.result);
    rd.onerror = () => toast('Could not read that photo – try again');
    rd.readAsDataURL(file);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id !== 'hbSearch') return;
    if (e.key === 'Enter') { e.preventDefault(); const f = $('#hbResults .hb-res'); if (f) go(f.dataset.go); }
    if (e.key === 'Escape') { e.target.value = ''; renderSearch(); }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.hb-search')) { const b = $('#hbResults'); if (b && !b.classList.contains('hidden')) b.classList.add('hidden'); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#scanOv')) { closeScanner(); return; }
    if (e.key === 'Escape' && $('#voiceOv')) { closeVoiceAssist(); return; }
    if (e.key === 'Escape') { closeModal(); closeMenu(); }
    if (e.key === 'Enter' && !$('#modalWrap').classList.contains('hidden') && e.target.tagName === 'INPUT') { e.preventDefault(); if (modalOnSubmit) modalOnSubmit(); }
  });

  /* live tickers: countdowns, order tracking, chat messages */
  setInterval(() => {
    const ci = checkinInfo();
    $$('[data-countdown]').forEach((el) => { el.textContent = fmtCountdown(ci.left); });
    if (ci.missed) {
      const gl = graceLeft(ci);
      $$('[data-grace]').forEach((el) => { el.textContent = fmtMS(gl); });
      $$('[data-grace-bar]').forEach((el) => { el.style.width = Math.round((gl / GRACE_MS) * 100) + '%'; });
    }
    if (sosAt) $$('[data-sos-elapsed]').forEach((el) => { el.textContent = fmtMS(Date.now() - sosAt); });
    const parts = parse();
    if (ci.missed && (parts[0] === 'checkins' || parts.length === 0) && !$('.countdown.missed, .alert-banner') && !($('#hbSearch') && $('#hbSearch').value)) rerender();
    const tl = $('[data-track]');
    if (tl) {
      const o = S().orders.find((x) => x.id === tl.dataset.track);
      if (o && stageOf(o) !== Number(tl.dataset.stage)) rerender();
    }
    const ch = $('[data-chat]');
    if (ch) {
      const visible = (S().chats[ch.dataset.chat] || []).filter((m) => m.t <= Date.now()).length;
      if (visible !== Number(ch.dataset.count)) {
        const typed = $('#chatText') ? $('#chatText').value : '';
        render(true);
        if ($('#chatText')) $('#chatText').value = typed;
        screen.scrollTop = screen.scrollHeight;
      }
    }
  }, 500);

  let navDepth = 0;
  let goingBack = false;
  window.addEventListener('hashchange', () => {
    if (goingBack) { navDepth = Math.max(0, navDepth - 1); goingBack = false; } else navDepth++;
    if (parse().length === 0) navDepth = 0;
    closeMenu(); closeModal(); closeScanner(); render();
  });
  render();
})();

</script>
</body>
</html>
