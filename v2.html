  <style>
/* Sick Buddy v2 – calm, soft, mobile-first styles.
   Primary: muted teal/sage. Backgrounds: warm off-white. Red is reserved for SOS / emergency. */
:root {
  --primary: #3b7dd8;        /* calm teal */
  --primary-dark: #2a62b5;
  --primary-soft: #e8f0fc;
  --primary-tint: #f4f8fe;
  --coral: #dc6b5f;          /* logo heart only */
  --sos: #d4574b;            /* emergency only */
  --sos-dark: #b8443a;
  --sos-soft: #fbeae7;
  --ink: #1f2a3a;
  --muted: #6b7686;
  --line: #e3e8f0;
  --bg: #f7f9fc;             /* warm off-white */
  --card: #ffffff;
  --green: #3b7dd8;
  --green-bg: #e8f0fc;
  --amber: #a97a1c;
  --amber-bg: #e5ebf5;
  --radius: 18px;
  --shadow: 0 4px 16px rgba(60,64,70, 0.06), 0 1px 3px rgba(44,50,58, 0.06);
  --font: "Nunito", "Segoe UI Rounded", "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: radial-gradient(circle at 15% 10%, #e9f1fc 0, transparent 40%), radial-gradient(circle at 85% 90%, #eef2f8 0, transparent 40%), #f3f6fa;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }
svg { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.25em; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.05rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
h3 { font-size: 1.15rem; display: flex; align-items: center; gap: .4rem; }
p { margin: .4rem 0; line-height: 1.45; }
small { font-size: .75em; font-weight: 600; }

/* ---------- device frame ---------- */
.device { min-height: 100%; display: flex; justify-content: center; align-items: center; }
.phone {
  position: relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
  background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 600px) {
  .device { padding: 24px; }
  .phone {
    height: min(880px, calc(100vh - 48px)); border-radius: 44px;
    border: 10px solid #2f343b; box-shadow: 0 30px 80px rgba(44,50,58, .22);
  }
}

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; background: var(--bg); z-index: 5;
}
.topbar-title { font-weight: 800; font-size: 1.05rem; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-red { background: var(--sos); color: #fff; }
.topbar-red .icon-btn { color: #fff; background: rgba(255,255,255,.18); box-shadow: none; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 14px; display: inline-grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink); flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.call { background: var(--green-bg); color: var(--green); box-shadow: none; }

/* ---------- screen ---------- */
.screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; outline: none; }
.screen.with-cartbar { padding-bottom: 90px; }
.view { padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 14px; animation: fadeIn .22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.muted { color: var(--muted); }
.small { font-size: .82rem; }
.strong { font-weight: 800; }
.block { display: block; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.intro { margin: 0; }
.footnote { font-size: .75rem; color: var(--muted); text-align: center; margin: 4px 0 0; }
.empty { text-align: center; padding: 16px; }
.link { color: var(--primary-dark); font-weight: 800; font-size: .9rem; }
.hidden { display: none !important; }
.free { color: var(--green); font-weight: 900; }

.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: 6px; }
.card-head h2 { margin: 0; }
.section-title { margin: 4px 2px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.badge-demo {
  display: inline-block; font-size: .64rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
  color: #7d6420; background: var(--amber-bg); border: 1px dashed #dcc07a; border-radius: 999px; padding: 1px 7px; vertical-align: 1px;
}
.banner-demo {
  display: flex; gap: .5rem; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800;
  color: #7d6420; background: var(--amber-bg); border: 1px dashed #dcc07a; border-radius: 12px; padding: 8px 10px;
}
.note { display: flex; gap: .5rem; align-items: flex-start; font-size: .85rem; background: var(--primary-tint); border: 1px solid #dde8f7; border-radius: 14px; padding: 10px 12px; margin: 0; }
.note > svg { margin-top: 1px; color: var(--primary-dark); }
.note a { color: var(--sos); font-weight: 800; }

/* ---------- home ---------- */
.hero { text-align: center; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; }
.logo-svg { display: block; margin: 0 auto; height: auto; }
.hero .logo-svg { animation: heartbeat 2.8s ease-in-out infinite; transform-origin: 50% 55%; }
@keyframes heartbeat { 0%, 30%, 60%, 100% { transform: scale(1); } 15%, 45% { transform: scale(1.04); } }
.brand { font-size: 2rem; font-weight: 900; letter-spacing: .02em; margin: 4px 0 0; color: var(--ink); }
.tagline { margin: 2px 0 8px; }
.city-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 10px; border-radius: 999px;
  background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: .85rem; color: var(--primary-dark);
}
.city-pill svg { width: 16px; height: 16px; }

.alert-banner {
  display: flex; gap: .6rem; align-items: center; background: var(--sos); color: #fff; border-radius: 14px; padding: 12px 14px; font-size: .88rem;
  animation: pulseBg 1.8s infinite;
}
@keyframes pulseBg { 50% { background: var(--sos-dark); } }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
@media (min-width: 380px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
.tile {
  background: var(--card); border-radius: var(--radius); padding: 14px 8px 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
  transition: transform .12s ease; min-height: 118px;
}
.tile:active { transform: scale(.96); }
.tile-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 4px; }
.tile-icon svg { width: 29px; height: 29px; }
.tile-label { font-weight: 800; font-size: .86rem; line-height: 1.15; }
.tile-sub { font-size: .7rem; color: var(--muted); }
.tone-peach .tile-icon { background: #e9eef6; color: #c27a4a; }
.tone-blue  .tile-icon { background: #e7eef7; color: #4f74a6; }
.tone-sage  .tile-icon { background: #e8f0fb; color: #3b7dd8; }
.tone-lilac .tile-icon { background: #eeecf5; color: #6e66a3; }
.tone-sky   .tile-icon { background: #e6eefb; color: #3a6fc0; }
.tone-sand  .tile-icon { background: #f2f5fa; color: #9b7f35; }
.tone-teal  .tile-icon { background: var(--primary-soft); color: var(--primary-dark); }
.tone-amber .tile-icon { background: #f4f7fb; color: #b08327; }
.tone-red   .tile-icon { background: var(--sos); color: #fff; }
.tone-red { background: #fdf5f3; border: 1.5px solid #f3d3cd; }

.mood-row { display: flex; justify-content: space-between; gap: 4px; }
.mood-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border-radius: 14px; font-size: .72rem; font-weight: 700; color: var(--muted); background: var(--primary-tint); transition: transform .1s; }
.mood-btn:active { transform: scale(.94); }
.mood-face { font-size: 1.7rem; line-height: 1; }
.mood-face.lg { font-size: 2rem; }
.mood-last { margin-bottom: 0; }

.contact-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.card-head + .contact-row, h2 + .contact-row { border-top: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #fff; background: linear-gradient(135deg, #7993b5, var(--primary)); flex: none; }
.avatar.alt { background: var(--primary-soft); color: var(--primary-dark); }
.avatar.lg { width: 50px; height: 50px; font-size: 1.2rem; }
.avatar.xl { width: 76px; height: 76px; font-size: 2rem; margin: 0 auto 8px; }
.avatar.xl svg { width: 36px; height: 36px; }

.checkin-mini { display: flex; align-items: center; gap: 12px; }
.checkin-mini-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #f4f7fb; color: #b08327; }
.checkin-mini-icon svg { width: 24px; height: 24px; }

/* ---------- drawer ---------- */
.scrim { position: absolute; inset: 0; background: rgba(44,50,58, .35); z-index: 20; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: 80%; max-width: 320px; background: var(--card); z-index: 21;
  transform: translateX(-105%); transition: transform .25s ease; padding: 24px 14px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
  box-shadow: 10px 0 40px rgba(0,0,0,.12);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.drawer-head .logo-svg { margin: 0; }
.drawer-name { font-weight: 900; font-size: 1.1rem; }
.drawer-link { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 12px; font-weight: 700; }
.drawer-link svg { color: var(--primary); width: 22px; height: 22px; }
.drawer-link:hover, .drawer-link:active { background: var(--primary-tint); }
.drawer-foot { margin-top: auto; padding: 16px 10px 0; font-size: .72rem; color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: 12px 18px; border-radius: 14px;
  font-weight: 800; font-size: .95rem; transition: transform .1s, opacity .2s; text-align: center;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-block { width: 100%; }
.btn-lg { padding: 16px 18px; font-size: 1.05rem; }
.btn-sm { padding: 7px 12px; font-size: .82rem; border-radius: 10px; margin-top: 8px; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(79,111,154, .28); }
.btn-primary:disabled { background: #dadee3; color: #9a9790; box-shadow: none; }
.btn-danger { background: var(--sos); color: #fff; box-shadow: 0 6px 16px rgba(212, 87, 75, .3); }
.btn-ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn-outline-danger { background: #fff; color: var(--sos-dark); border: 1.5px solid #ecc2bb; }
.quick-calls { display: flex; gap: 10px; flex-wrap: wrap; }
.quick-calls .btn { flex: 1; min-width: 130px; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chips.center { justify-content: center; }
.chip { padding: 8px 13px; border-radius: 999px; background: var(--primary-tint); border: 1.5px solid #dfe8f5; font-weight: 700; font-size: .85rem; }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ---------- contacts ---------- */
.contact-card { display: flex; align-items: center; gap: 12px; }
.row-actions { display: flex; gap: 6px; }
.row-actions .icon-btn { width: 36px; height: 36px; border-radius: 12px; box-shadow: none; background: var(--primary-tint); }
.row-actions .icon-btn.call { background: var(--green-bg); }
.row-actions .icon-btn svg { width: 18px; height: 18px; }

/* ---------- city picker ---------- */
.city-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.city-opt, .level { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); }
.city-opt.on, .level.on { border-color: var(--primary); background: var(--primary-tint); }
.radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c9cdd3; flex: none; position: relative; }
.on > .radio-dot { border-color: var(--primary); }
.on > .radio-dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--primary); }

/* ---------- check-ins ---------- */
.countdown { margin: 14px 0 8px; }
.countdown-num { font-size: 2.6rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); }
.countdown.missed .countdown-num { color: var(--sos); }
.ok-btn {
  width: 170px; height: 170px; border-radius: 50%; margin: 10px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: radial-gradient(circle at 35% 30%, #7c9bc3, var(--green)); color: #fff; font-weight: 900; font-size: 1.3rem;
  box-shadow: 0 0 0 10px var(--green-bg), 0 12px 30px rgba(75,109,154, .3); transition: transform .12s;
}
.ok-btn svg { width: 46px; height: 46px; stroke-width: 2.6; }
.ok-btn:active { transform: scale(.95); }
.ok-btn.wide { width: 100%; height: auto; border-radius: 16px; flex-direction: row; padding: 16px; font-size: 1.05rem; box-shadow: 0 8px 20px rgba(75,109,154,.28); }
.ok-btn.wide svg { width: 24px; height: 24px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; font-weight: 700; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: #dcd8d0; position: relative; transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--green); }
.switch.on span { transform: translateX(20px); }
.demo-card { border: 1.5px dashed #e2cb8f; box-shadow: none; background: #f7f9fc; }

.alert-hero { text-align: center; padding: 8px 0 0; }
.alert-hero h1 { color: var(--sos-dark); margin-top: 14px; }
.pulse-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: var(--sos); color: #fff;
  font-weight: 900; font-size: 1.6rem; animation: ring 1.6s infinite;
}
.pulse-ring svg { width: 52px; height: 52px; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(212,87,75,.45); } 100% { box-shadow: 0 0 0 28px rgba(212,87,75,0); } }
.status-pill { font-size: .72rem; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--amber-bg); color: #7d6420; white-space: nowrap; display: inline-block; }
.status-pill.ok { background: var(--green-bg); color: var(--green); }
.msg-preview { margin-top: 10px; background: var(--primary-tint); border-radius: 14px; padding: 10px 12px; font-size: .86rem; font-style: italic; }
.msg-preview .small { font-style: normal; font-weight: 800; margin-bottom: 4px; }

/* ---------- SOS (the one place red is used) ---------- */
.sos-wrap { display: grid; place-items: center; padding: 18px 0 10px; }
.sos-btn {
  width: 200px; height: 200px; border-radius: 50%; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, #e8786d, var(--sos) 70%);
  box-shadow: 0 0 0 14px #f8e1dd, 0 0 0 28px #fcf1ef, 0 16px 40px rgba(212, 87, 75, .35);
  animation: sosPulse 2.2s infinite; transition: transform .12s;
}
.sos-btn:active { transform: scale(.95); }
.sos-text { font-size: 3.3rem; font-weight: 900; letter-spacing: .06em; line-height: 1; }
.sos-sub { font-size: .9rem; font-weight: 700; opacity: .9; }
@keyframes sosPulse { 50% { box-shadow: 0 0 0 18px #f8e1dd, 0 0 0 36px #fcf1ef, 0 16px 40px rgba(212, 87, 75, .35); } }
.ticks { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 10px; }
.ticks li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.35; }
.ticks li svg { color: var(--primary-dark); margin-top: 1px; }
.ticks.plain li::before { content: "•"; color: var(--primary); font-weight: 900; }

/* ---------- shop ---------- */
.shop-head { display: flex; gap: 12px; align-items: center; background: var(--primary-tint); border: 1px solid #dfe5ec; border-radius: var(--radius); padding: 12px 14px; }
.shop-head .small { margin-top: 2px; }
.food-head { background: #edf1f8; border-color: #d1ddee; }
.food-head .shop-icon { color: #c27a4a; }
.shop-icon { width: 50px; height: 50px; border-radius: 16px; background: #fff; color: var(--primary-dark); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.shop-icon svg { width: 28px; height: 28px; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px; }
.item.compact { padding: 10px 12px; }
.item-thumb { width: 58px; height: 58px; border-radius: 14px; background: #eaeff6; color: var(--primary-dark); display: grid; place-items: center; flex: none; }
.item-thumb svg { width: 28px; height: 28px; }
.item-thumb.sm { width: 44px; height: 44px; border-radius: 12px; }
.item-thumb.sm svg { width: 22px; height: 22px; }
.item-thumb .emoji { font-size: 1.9rem; line-height: 1; }
.item-thumb.sm .emoji { font-size: 1.4rem; }
.item-thumb.ok { background: var(--green-bg); color: var(--green); }
.item-thumb.warn { background: var(--amber-bg); color: var(--amber); }
.item-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.kitchen { display: flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; color: #a0663f; margin-top: 3px; min-width: 0; }
.kname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kkind { flex: none; font-size: .66rem; font-weight: 800; color: #9a7a5c; background: #e6ecf5; border-radius: 999px; padding: 1px 6px; }
.kitchen svg { width: 14px; height: 14px; }
.price { font-weight: 900; color: var(--ink); }
.mrp { font-size: .78rem; color: var(--muted); }
.off { font-size: .68rem; font-weight: 800; color: var(--green); background: var(--green-bg); border-radius: 999px; padding: 2px 7px; }
.tag { font-size: .66rem; font-weight: 800; background: var(--primary-soft); color: var(--primary-dark); border-radius: 999px; padding: 2px 8px; vertical-align: 2px; white-space: nowrap; }
.add-btn { display: inline-flex; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 800; font-size: .85rem; flex: none; }
.add-btn svg { width: 16px; height: 16px; }
.qty { display: flex; align-items: center; gap: 8px; background: var(--primary-tint); border-radius: 12px; padding: 4px; font-weight: 900; flex: none; }
.qty-btn { width: 30px; height: 30px; border-radius: 10px; background: #fff; color: var(--primary-dark); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.qty-btn svg { width: 16px; height: 16px; }

/* delivery plan (now / schedule) */
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
.seg { display: flex; flex-direction: column; align-items: center; padding: 10px 6px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; }
.seg small { color: var(--muted); font-weight: 600; }
.seg.on { border-color: var(--primary); background: var(--primary-tint); color: var(--primary-dark); }
.meal-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
.meal-slot { display: flex; flex-direction: column; align-items: flex-start; padding: 9px 12px; border-radius: 12px; background: var(--primary-tint); border: 1.5px solid #dfe8f5; text-align: left; }
.meal-slot.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.meal-slot:disabled { opacity: .45; }
.meal-slot:disabled .small::after { content: " · passed"; }

.cartbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 6; }
.cartbar-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--primary); color: #fff; font-weight: 800; box-shadow: 0 8px 20px rgba(79,111,154,.3); }
.cartbar-btn span:nth-child(2) { flex: 1; text-align: left; line-height: 1.2; }
.cartbar-btn small { opacity: .9; }
.cartbar-count { background: #fff; color: var(--primary-dark); border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; font-weight: 900; padding: 0 6px; }

.free-card { background: #ffffff; border: 1px solid #cad7eb; box-shadow: none; }
.free-card.unlocked { background: var(--green-bg); border-color: #cfd9e6; }
.progress { height: 8px; border-radius: 99px; background: #dce3ee; margin: 8px 0 6px; overflow: hidden; }
.progress span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #8ca5c5, var(--primary)); transition: width .3s; }
.unlocked .progress span { background: var(--green); }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: .92rem; }
.sum-row > span:last-child { white-space: nowrap; }
.sum-row.saving { color: var(--green); font-weight: 700; }
.sum-row.total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 900; font-size: 1.05rem; }
.check-row { display: flex; gap: 8px; align-items: center; font-size: .88rem; margin-top: 6px; }
.check-row input { accent-color: var(--primary); width: 18px; height: 18px; }

.empty-state { text-align: center; padding: 40px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty-state > svg { width: 64px; height: 64px; color: #b9c5d4; }

/* ---------- tracking ---------- */
.track-hero, .confirm-hero { text-align: center; padding: 10px 0 0; }
.rider, .big-check { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; background: var(--primary-soft); color: var(--primary-dark); animation: bob 1.8s ease-in-out infinite; }
.rider.sched { animation: none; background: #e8eef6; color: #c27a4a; }
.rider svg, .big-check svg { width: 46px; height: 46px; }
.track-hero.done .rider, .big-check { background: var(--green-bg); color: var(--green); animation: pop .4s ease; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes pop { 0% { transform: scale(.6); } 80% { transform: scale(1.08); } 100% { transform: scale(1); } }
.timeline { list-style: none; margin: 0 0 8px; padding: 0; }
.timeline li { display: flex; gap: 12px; position: relative; padding-bottom: 18px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li.done::before { background: var(--green); }
.timeline .dot { width: 28px; height: 28px; border-radius: 50%; background: #e4e8ef; color: #fff; display: grid; place-items: center; flex: none; z-index: 1; }
.timeline .dot svg { width: 16px; height: 16px; stroke-width: 3; }
.timeline li.done .dot { background: var(--green); }
.timeline li.current .dot { background: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
.timeline li:not(.done):not(.current) .strong { color: var(--muted); }
.sched-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
h2 + .sched-row { border-top: 0; }
.sched-row.cancelled { opacity: .55; text-decoration: line-through; }
.sched-dot { width: 36px; height: 36px; border-radius: 12px; background: #e8eef6; color: #c27a4a; display: grid; place-items: center; }

/* ---------- booking ---------- */
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.days-scroll { display: flex; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.days-scroll::-webkit-scrollbar { display: none; }
.days-scroll .day { min-width: 74px; flex: none; }
.day { display: flex; flex-direction: column; align-items: center; padding: 9px 4px; border-radius: 14px; background: var(--primary-tint); border: 1.5px solid #dfe8f5; font-size: .85rem; }
.day.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.slot { padding: 10px 0; border-radius: 12px; background: var(--primary-tint); border: 1.5px solid #dfe8f5; font-weight: 800; font-size: .8rem; }
.slot.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.slot:disabled { opacity: .4; text-decoration: line-through; }
.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.mode-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 14px 8px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; }
.mode-card.on { border-color: var(--primary); background: var(--primary-tint); }
.mode-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #e8f0fb; color: #3b7dd8; margin-bottom: 4px; }
.mode-card:nth-child(2) .mode-icon { background: #e7eef7; color: #4f74a6; }
.mode-price { font-size: 1.25rem; font-weight: 900; color: var(--primary-dark); }
.level-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.level-price { font-weight: 900; color: var(--primary-dark); white-space: nowrap; text-align: right; }
.level-price small { color: var(--muted); font-weight: 700; }
.stepper-row { display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-top: 6px; }
.ticket { padding: 6px 16px 16px; }
.ticket-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.ticket-row span:last-child { text-align: right; }
.ticket-code { text-align: center; margin-top: 12px; font-weight: 900; letter-spacing: .1em; color: var(--primary-dark); }

/* ---------- package chat (demo) ---------- */
.pkg-summary { display: flex; flex-direction: column; gap: 4px; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 84%; padding: 9px 12px; border-radius: 16px; font-size: .9rem; line-height: 1.4; display: flex; flex-direction: column; }
.msg.nurse { align-self: flex-start; background: #fff; box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
.msg.system { align-self: center; max-width: 92%; background: var(--amber-bg); color: #7d6420; font-size: .78rem; font-weight: 700; text-align: center; border-radius: 12px; }
.msg-name { font-size: .72rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 2px; }
.msg-time { font-size: .66rem; opacity: .6; align-self: flex-end; margin-top: 3px; }
.msg.typing { flex-direction: row; gap: 4px; padding: 12px 14px; }
.msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: #b9bec4; animation: blink 1.2s infinite; }
.msg.typing i:nth-child(2) { animation-delay: .2s; }
.msg.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .3; } }
.chat-input { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 6px 0; }
.chat-input input { flex: 1; font: inherit; font-size: .95rem; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; outline: none; }
.chat-input input:focus { border-color: var(--primary); }
.icon-btn.send { background: var(--primary); color: #fff; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; margin: 10px 0; font-size: .82rem; font-weight: 800; color: var(--muted); }
.field input, .field textarea, .field select {
  font: inherit; font-size: 1rem; font-weight: 600; color: var(--ink); padding: 12px 13px; border-radius: 12px;
  border: 1.5px solid var(--line); background: #fff; outline: none; resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.form-error { color: var(--sos-dark); font-size: .85rem; font-weight: 700; min-height: 1em; margin: 0; }

/* ---------- tabs ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: #e0e5ec; border-radius: 14px; padding: 4px; }
.tab { padding: 10px; border-radius: 11px; font-weight: 800; color: var(--muted); }
.tab.on { background: #fff; color: var(--primary-dark); box-shadow: var(--shadow); }

/* ---------- report ---------- */
.report { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .88rem; }
.report th { text-align: left; font-size: .72rem; text-transform: uppercase; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); }
.report td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.report tr.low td:first-child { color: var(--amber); font-weight: 800; }
.flag { font-size: .66rem; font-weight: 900; background: var(--amber-bg); color: var(--amber); padding: 1px 6px; border-radius: 999px; }

/* ---------- log ---------- */
.list-item { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px; border-radius: 16px; box-shadow: var(--shadow); margin-top: 8px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 6px; }
.bar { flex: 1; border-radius: 8px 8px 4px 4px; min-height: 8px; }

/* ---------- modal & toast ---------- */
.modal-wrap { position: absolute; inset: 0; background: rgba(44,50,58, .4); z-index: 30; display: flex; align-items: flex-end; }
.modal { width: 100%; background: #fff; border-radius: 24px 24px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 90%; overflow-y: auto; animation: up .22s ease; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }
.toast {
  position: absolute; left: 50%; bottom: 100px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 14px;
  font-size: .88rem; font-weight: 700; opacity: 0; pointer-events: none; transition: all .25s; z-index: 40; width: max-content; max-width: 88%; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* =====================================================================
   REDESIGN · STEP 1 — HOME
   Scoped to the home screen (.hm-*) so other screens stay as original.
   ===================================================================== */
.redesign-tag {
  position: fixed; top: 10px; left: 12px; z-index: 50; pointer-events: none;
  font-size: .68rem; font-weight: 800; letter-spacing: .04em; color: #6d737a;
  background: rgba(255,255,255,.7); border: 1px solid #d4dae3; border-radius: 999px; padding: 4px 10px;
  backdrop-filter: blur(6px);
}
@media (max-width: 599px) { .redesign-tag { display: none; } }

.topbar-home { background: #eef4fd; }
.topbar-home .icon-btn { background: rgba(255,255,255,.75); box-shadow: 0 1px 2px rgba(44,50,58,.06); backdrop-filter: blur(6px); }
.screen.is-home { background:
  radial-gradient(120% 60% at 100% 0%, #dce4ef 0, rgba(220,228,239,0) 60%),
  linear-gradient(180deg, #eef4fd 0, var(--bg) 340px); }
.screen.is-home { background-attachment: local; }
.screen.is-home .view { padding: 6px 18px 32px; gap: 0; }

.hm { display: flex; flex-direction: column; gap: 22px; }
.hm-eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--primary-dark); margin: 0 2px 10px; display: flex; align-items: center; justify-content: space-between; }
.hm-eyebrow a { text-transform: none; letter-spacing: 0; font-size: .82rem; color: var(--primary-dark); display: inline-flex; align-items: center; gap: 2px; }
.hm-eyebrow a svg { width: 15px; height: 15px; }

/* hero */
.hm-hero { position: relative; display: flex; flex-direction: column; gap: 14px; }
.hm-brandrow { display: flex; align-items: center; gap: 10px; }
.hm-mark { width: 46px; height: 46px; border-radius: 15px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(79,111,154,.16); flex: none; }
.hm-mark .logo-svg { width: 38px !important; animation: heartbeat 2.8s ease-in-out infinite; transform-origin: 50% 55%; }
.hm-brand { font-weight: 900; font-size: 1.05rem; letter-spacing: .01em; line-height: 1.1; }
.hm-brand small { display: block; font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.hm-greet { font-size: 1.85rem; font-weight: 900; line-height: 1.12; letter-spacing: -.01em; margin: 2px 0 0; color: var(--ink); }
.hm-greet span { color: var(--primary); }
.hm-sub { margin: 0; color: var(--muted); font-size: .98rem; font-weight: 600; }
.hm-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hm-city {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 10px; border-radius: 999px;
  background: #fff; border: 1px solid #dde8f7; font-weight: 800; font-size: .84rem; color: var(--primary-dark);
  box-shadow: 0 2px 8px rgba(79,111,154,.08); transition: transform .1s;
}
.hm-city:active { transform: scale(.97); }
.hm-city svg { width: 16px; height: 16px; }
.hm-city .hm-city-down { width: 14px; height: 14px; opacity: .7; }
.hm-demo {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px;
  font-size: .7rem; font-weight: 800; color: #866a22; background: #e7edf6; border: 1px dashed #e2cc8e;
}
.hm-demo svg { width: 13px; height: 13px; }

/* SOS strip – the only red on home */
.hm-sos {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px;
  background: linear-gradient(135deg, #e0685c, var(--sos) 55%, var(--sos-dark));
  color: #fff; box-shadow: 0 10px 24px rgba(212,87,75,.28); transition: transform .12s;
}
.hm-sos:active { transform: scale(.98); }
.hm-sos-icon { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; position: relative; }
.hm-sos-icon::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); animation: hmPing 2.4s ease-out infinite; }
@keyframes hmPing { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
.hm-sos-icon svg { width: 24px; height: 24px; }
.hm-sos-text { flex: 1; min-width: 0; line-height: 1.2; }
.hm-sos-text strong { display: block; font-size: 1.05rem; font-weight: 900; }
.hm-sos-text span { font-size: .8rem; opacity: .9; font-weight: 600; }
.hm-sos-go { font-weight: 900; font-size: .8rem; letter-spacing: .08em; background: #fff; color: var(--sos-dark); border-radius: 999px; padding: 7px 12px; flex: none; }

/* generic home card */
.hm-card { background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 1px 2px rgba(44,50,58,.04), 0 8px 24px rgba(60,64,70,.06); border: 1px solid #eef1f6; }

/* mood check-in */
.hm-mood-q { font-size: 1.12rem; font-weight: 900; margin: 0 0 2px; }
.hm-mood-hint { margin: 0 0 14px; font-size: .84rem; color: var(--muted); }
.hm-moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.hm-mood { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; font-size: .72rem; font-weight: 800; color: var(--muted); transition: transform .1s; }
.hm-mood:active { transform: scale(.93); }
.hm-mood-face { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; line-height: 1; background: var(--primary-tint); border: 2px solid transparent; transition: background .15s, border-color .15s, transform .15s; }
.hm-mood:hover .hm-mood-face { background: var(--primary-soft); }
.hm-mood.on .hm-mood-face { background: var(--primary-soft); border-color: var(--primary); transform: translateY(-2px); }
.hm-mood.on { color: var(--primary-dark); }
.hm-last { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 14px; background: var(--primary-tint); font-size: .8rem; color: var(--muted); font-weight: 600; }
.hm-last strong { color: var(--ink); }
.hm-last .mood-face { font-size: 1.1rem; }

/* quick actions */
.hm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hm-tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 14px 13px;
  background: #fff; border-radius: 20px; border: 1px solid #eef1f6; box-shadow: 0 1px 2px rgba(44,50,58,.04), 0 6px 18px rgba(60,64,70,.05);
  transition: transform .12s, box-shadow .12s; min-height: 112px;
}
.hm-tile:active { transform: scale(.97); }
.hm-tile:hover { box-shadow: 0 1px 2px rgba(44,50,58,.05), 0 10px 24px rgba(60,64,70,.09); }
.hm-tile-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
.hm-tile-icon svg { width: 25px; height: 25px; }
.hm-tile-label { font-weight: 900; font-size: .92rem; line-height: 1.15; }
.hm-tile-sub { display: block; font-size: .74rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
.hm-tile-arrow { position: absolute; top: 14px; right: 12px; width: 16px; height: 16px; color: #c3c6cb; }
.hm-tile.tone-peach .hm-tile-icon { background: #e9eef6; color: #c27a4a; }
.hm-tile.tone-blue  .hm-tile-icon { background: #e7eef7; color: #4f74a6; }
.hm-tile.tone-sage  .hm-tile-icon { background: #e8f0fb; color: #3b7dd8; }
.hm-tile.tone-lilac .hm-tile-icon { background: #eeecf5; color: #6e66a3; }
.hm-tile.tone-sky   .hm-tile-icon { background: #e6eefb; color: #3a6fc0; }
.hm-tile.tone-sand  .hm-tile-icon { background: #f2f5fa; color: #9b7f35; }
.hm-tile.tone-teal  .hm-tile-icon { background: var(--primary-soft); color: var(--primary-dark); }
.hm-tile.tone-amber .hm-tile-icon { background: #f4f7fb; color: #b08327; }

/* safety net: check-in + contacts */
.hm-checkin { display: flex; align-items: center; gap: 14px; }
.hm-ring { --p: 0; width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--primary) calc(var(--p) * 1%), #e9ebee 0); }
.hm-ring > span { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--primary-dark); }
.hm-ring svg { width: 22px; height: 22px; }
.hm-ring.paused { background: #e0e5ec; }
.hm-ring.paused > span { color: var(--muted); }
.hm-checkin-t { flex: 1; min-width: 0; }
.hm-checkin-t strong { display: block; font-size: .98rem; font-weight: 900; }
.hm-checkin-t .small { color: var(--muted); font-weight: 600; }
.hm-count { font-variant-numeric: tabular-nums; font-weight: 900; color: var(--primary-dark); }
.hm-ok { padding: 9px 14px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 800; font-size: .82rem; box-shadow: 0 6px 14px rgba(79,111,154,.25); flex: none; }
.hm-divider { height: 1px; background: var(--line); margin: 16px 0 14px; }
.hm-contacts-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

.hm-contacts-head a { font-size: .82rem; font-weight: 800; color: var(--primary-dark); }
.hm-people { display: flex; flex-direction: column; gap: 8px; }
.hm-person { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border-radius: 16px; background: #f4f6fa; }
.hm-person .avatar { width: 38px; height: 38px; font-size: .95rem; }
.hm-person .grow .strong { font-size: .92rem; }
.hm-person .icon-btn.call { width: 38px; height: 38px; border-radius: 12px; }
.hm-person .icon-btn.call svg { width: 18px; height: 18px; }

.hm-foot { text-align: center; font-size: .72rem; color: var(--muted); margin: 2px 0 0; line-height: 1.5; }
